        dalbodem. Vanaf de zijkanten komt bovendien grondwater omhoog dat op de hogere
        gronden is ingezijgd; dat noemen we kwel. Beekdalen waren daardoor te nat voor
        akkers en werden gebruikt als hooiland en weide, met elzen en wilgen langs de
        randen. Veel beken zijn later rechtgetrokken en dieper gemaakt.
      versterken:
        - "Kies natte soorten: zwarte els, schietwilg, boswilg, grauwe wilg, vogelkers en gelderse roos."
