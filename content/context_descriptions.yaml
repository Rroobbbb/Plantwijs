    - id: komvlakte
      match_exact: []
      match: ["komvlakte", "komklei", "kommen", "vlakte van getijde-", "rivierkom", "komgrond"]
      titel: "Komvlakte"
      ontstaan: >-
        Ver van de rivierbedding kwam bij hoogwater alleen nog traag stromend water,
        dat vrijwel geen zand meer meevoerde. Wat daar bezonk was de allerfijnste klei.
        Zo ontstonden de kommen: lage, vlakke gebieden met zware klei die water slecht
        doorlaat. In de winter staat het water er lang op het land en in de zomer
        scheurt de grond open. Kommen waren te nat voor akkers en bleven eeuwenlang
        grasland, moeras en broekbos, met wilgengrienden en elzen op de natste plekken.
      versterken:
        - "Kies soorten die zware, natte klei verdragen: zwarte els, schietwilg, gelderse roos, sporkehout en eenstijlige meidoorn."
        - "Zet knotwilgen langs sloten en kavelgrenzen; die passen bij dit natte deel van het rivierenland."
        - "Plant iets verhoogd of op een lichte rug waar water blijft staan, zodat de wortelhals niet verdrinkt."
        - "Werk nooit op natte klei. Verdichte komklei herstelt zich jarenlang niet."
        - "Houd de openheid van de kom in stand; plant in lijnen langs de kavelgrenzen en niet in blokken midden in het veld."
