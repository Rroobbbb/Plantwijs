        - "Plant aan de landzijde van het erf en laat de zeezijde laag of open."
        - "Vermijd woekeraars die in de duinen problemen geven, zoals rimpelroos en Amerikaanse vogelkers."
        - "Laat vochtige duinvalleien open; daar horen lage, kruidenrijke begroeiing en geen bomen."
        - "Bemest niet en geef geen water; schraalte hoort bij dit landschap."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); Geologie van Nederland (TNO-GDN), kustduin; natuurkennis.nl (OBN), Duin- en kustlandschap"

