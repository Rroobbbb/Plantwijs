    - id: strandwal_strandvlakte
      match_exact: []
      match: ["strandwal", "strandvlakte", "oude duinen", "strandwallen"]
      titel: "Strandwal of strandvlakte"
      ontstaan: >-
        Na de laatste ijstijd steeg de zeespiegel eerst snel. Toen die stijging ongeveer
        vijfduizend jaar geleden sterk afzwakte, kon de zee langs de kust zandruggen
        opbouwen: strandwallen. Achter elke wal ontstond een lagere, nattere
        strandvlakte. Doordat de kustlijn zich stap voor stap zeewaarts verplaatste,
        ontstond tot ongeveer het begin van onze jaartelling een reeks evenwijdige
        ruggen en vlaktes. Op de droge strandwallen kwamen de oudste dorpen, wegen en
        later de landgoederen en bollenvelden; in de natte strandvlaktes groeide veen en
        lag weiland. De kalk is uit de bovengrond van deze oude wallen grotendeels
        weggespoeld, waardoor de grond er zuurder is dan in de jonge duinen.
      versterken:
        - "Kies op de droge strandwal soorten van zandgrond: zomereik, ruwe berk, hazelaar, lijsterbes en hulst."
        - "Kies in de lagere strandvlakte natte soorten: zwarte els, schietwilg, gelderse roos en sporkehout."
        - "Plant in de lengterichting van de wallen; het evenwijdige patroon is hier het kenmerk van het landschap."
        - "Leg langs de oude wegen een bomenrij of laan aan; dat past bij de bewoningsgeschiedenis van de wal."
        - "Houd de overgang tussen wal en vlakte zichtbaar met een struweelrand in plaats van een strakke grens."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); Toelichting bij de legenda Geomorfologische kaart van Nederland 1:50.000 (WUR, 2017); Geologie van Nederland (TNO-GDN)"

