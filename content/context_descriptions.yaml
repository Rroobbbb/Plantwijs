        het mengsel van mest en plaggen op hun akkers. Zo groeide de akker langzaam
        omhoog en ontstond een dikke, donkere bouwvoor van soms wel een meter dik.
        Zulke essen liggen bijna altijd op de hogere, droge delen van het zandlandschap,
        vlak bij het dorp. De randen zijn vaak nog te herkennen aan een steilrandje met
