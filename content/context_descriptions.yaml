  nsn:
    - id: ontgonnen_hoogveen
      match_exact: ["ontgonnen hoogveen"]
      match: ["ontgonnen hoogveen", "veenkolon", "dalgrond"]
      titel: "Ontgonnen hoogveen"
      ontstaan: >-
        Hier lag ooit een dik hoogveenpakket. Vanaf de zeventiende eeuw is dat
        grotendeels afgegraven voor turf. Er werden kanalen en wijken gegraven om het
        veen af te voeren en het gebied stap voor stap af te werken. Wat overbleef was
        de zandondergrond met een restje veen, dat werd omgezet tot dalgrond en in
        cultuur gebracht. Het resultaat is een strak, open landschap met rechte
        kanalen, lange smalle kavels en lintbebouwing langs de vaart. De bodem is arm,
        zuur en gevoelig voor droogte.
      versterken:
        - "Volg met beplanting het rechte patroon van kanalen, wijken en wegen; die strakheid is de identiteit van dit landschap."
        - "Leg singels of een laanbeplanting aan langs de vaart of de weg, in plaats van losse groepen midden in het veld."
        - "Kies soorten voor arme, wisselend natte grond: zwarte els, zachte berk, ruwe berk, zomereik en lijsterbes."
        - "Houd de openheid van het middenveld in stand; de wijdsheid hoort hier bij."
        - "Bemest niet zwaar; op dalgrond spoelen voedingsstoffen snel uit naar het oppervlaktewater."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland); eigen bewerking"

    - id: hoogveen
      match_exact: ["hoogveen"]
      match: ["hoogveen", "veenmos"]
      titel: "Hoogveen"
      ontstaan: >-
        Hoogveen groeit alleen van regenwater. Veenmossen houden dat water als een
        spons vast en groeien aan de bovenkant door terwijl ze onderin afsterven zonder
        te verteren. Zo groeide het veen als een bolle kussen boven het grondwater uit,
        soms meters dik. Doordat er alleen regenwater in komt, is hoogveen extreem arm
        aan voedingsstoffen en sterk zuur. Vrijwel al het Nederlandse hoogveen is
        afgegraven of ontwaterd; wat er nog ligt is zeldzaam en kwetsbaar. Het systeem
        werkt alleen bij een permanent hoge waterstand.
      versterken:
        - "Plant hier geen bomen of struiken. Levend hoogveen hoort open te zijn; bomen verdampen water en drogen het veen uit."
        - "Verwijder opslag van berk en grove den als die zich in het veen vestigt; dat is hier juist beheerwerk."
        - "Ga zeer terughoudend om met ontwatering in de omgeving; hoogveen is volledig afhankelijk van een hoge waterstand."
        - "Leg beplanting op afstand aan, als bufferzone op de rand: zachte berk, sporkehout en geoorde wilg passen daar."
        - "Voer geen mest, bagger of grond aan in of nabij het veen; hoogveen verdraagt geen verrijking."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland); eigen bewerking"

    - id: beekdal_veen
      match_exact: ["beekdal veen"]
      match: ["beekdal veen", "veenbeekdal"]
      titel: "Beekdal met veen"
      ontstaan: >-
        In de laagste delen van een beekdal bleef het jaarrond zo nat dat plantenresten
        niet konden verteren. Daar groeide veen in de dalbodem, gevoed door de beek en
        door kwel: grondwater dat op de hogere zandgronden is ingezijgd en hier weer
        aan de oppervlakte komt. Dat kwelwater is vaak kalkrijk en ijzerhoudend, wat
        deze plekken bijzonder maakt. Van oudsher waren dit natte hooilanden en
        elzenbroekbossen. Waar later ontwaterd is, is het veen ingeklonken en de
        dalbodem gezakt.
      versterken:
        - "Kies uitgesproken natte soorten: zwarte els, schietwilg, grauwe wilg, geoorde wilg, laurierwilg en gelderse roos."
        - "Plant langs de dalrand en houd de natte dalbodem zelf open als hooiland of moeras."
        - "Verlaag het waterpeil niet om te kunnen planten; dat laat het veen verteren en de bodem verder zakken."
        - "Voer maaisel af en bemest niet. Op kwelrijke veenbodems levert verschraling snel bijzondere planten op."
        - "Een elzensingel of een rij knotwilgen langs de dalrand is hier de meest passende vorm."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland); eigen bewerking"

    - id: beekdal_zand_leem
      match_exact: ["beekdal zand/leem", "beekdal zand-leem"]
      match: ["beekdal zand", "beekdal leem", "beekdal zand/leem"]
      titel: "Beekdal op zand en leem"
      ontstaan: >-
        Een beek heeft zich hier door het zandlandschap gesleten en een laag, vlak dal
        achtergelaten. Bij hoogwater trad de beek buiten haar oevers en zette fijn zand
        en leem af op de dalbodem. Vanaf de flanken komt bovendien kwelwater omhoog dat
        op de hogere zandgronden is ingezijgd. Daardoor is het dal veel vochtiger en
        voedselrijker dan de omringende zandgrond. Deze dalen waren te nat voor akkers
        en werden gebruikt als hooiland en weide, met elzen en wilgen langs de kanten.
        Veel beken zijn in de twintigste eeuw rechtgetrokken en verdiept.
      versterken:
        - "Kies soorten van vochtige, iets rijkere grond: zwarte els, schietwilg, boswilg, vogelkers, hazelaar en gelderse roos."
        - "Leg een elzensingel of struweelrand aan op de overgang van dal naar hogere grond; dat is hier de klassieke lijn."
        - "Houd de dalbodem open als grasland en plant niet strak tot aan de beek; een kruidenrijke oeverstrook is waardevol."
        - "Zorg dat de beek voldoende licht houdt; een volledig dichtgegroeide beek verliest veel waterleven."
        - "Voer maaisel af en bemest niet; verschraald beekdalgrasland wordt snel bloemrijk."
        - "Stem het planten af met het waterschap in verband met de onderhoudsstrook langs de beek."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland); eigen bewerking"

    - id: beekdal
      match_exact: ["beekdal"]
      match: ["beekdal"]
      titel: "Beekdal"
      ontstaan: >-
        Dit is de laagte waar een beek doorheen stroomt of ooit stroomde. Het water
        heeft het dal in de loop van duizenden jaren uitgesleten en er bij hoogwater
