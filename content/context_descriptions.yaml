        boerderij op.
      versterken:
        - "Kies droogteverdragende soorten die bij zandgrond horen: zomereik, ruwe berk, hazelaar, sleedoorn en lijsterbes."
        - "Zet een solitaire eik of een kleine boomgroep op de kop; dat maakt de hoogte in het vlakke land zichtbaar."
        - "Houd de overgang van de droge kop naar het natte omringende land geleidelijk met een struweelrand."
        - "Kies aan de voet van de kop juist natte soorten: zwarte els, schietwilg en gelderse roos."
        - "Graaf niet af en hoog niet op; het hoogteverschil is hier de historische en landschappelijke waarde."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: oeverwal_stroomrug
      match_exact: []
      match: ["oeverwal", "stroomrug", "stroomruggen", "meanderruggen", "kronkelwaardrug"]
      titel: "Oeverwal of stroomrug"
      ontstaan: >-
        Als een rivier bij hoogwater buiten haar oevers trad, stroomde het water direct
        naast de bedding sterk af. Het grovere materiaal, zand en zavel, bleef daardoor
        vlak langs de rivier liggen en bouwde daar een langgerekte rug op. Zo'n oeverwal
        ligt hoger en droger dan het land erachter en is bovendien lichter en beter
        bewerkbaar. Dat maakte hem tot de aantrekkelijkste plek in het rivierengebied:
        dorpen, boerderijen, akkers en boomgaarden liggen er van oudsher op. Waar de
        rivier later verlegd is, ligt de oude stroomrug nog altijd als een flauwe
        verhoging in het land.
      versterken:
        - "Plant een meidoornhaag of struweelhaag als erfgrens; dat is hier de klassieke perceelscheiding."
        - "Leg een hoogstamboomgaard aan met appel, peer, pruim en kers. Op de oeverwal is dat van oudsher de plek."
        - "Kies soorten van rijke, goed doorlatende grond: zoete kers, walnoot, veldesdoorn, hazelaar en kardinaalsmuts."
        - "Zet een bomenrij of laan langs de weg of de oprit; die versterkt de lijn van de stroomrug."
        - "Houd het hoogteverschil met de lager gelegen kom zichtbaar en plant daar juist wilg en els."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: komvlakte
      match_exact: []
      match: ["komvlakte", "komklei", "kommen", "vlakte van getijde-", "rivierkom", "komgrond"]
      titel: "Komvlakte"
      ontstaan: >-
        Ver van de rivierbedding kwam bij hoogwater alleen nog traag stromend water,
        dat vrijwel geen zand meer meevoerde. Wat daar bezonk was de allerfijnste klei.
        Zo ontstonden de kommen: lage, vlakke gebieden met zware klei die water slecht
        doorlaat. In de winter staat het water er lang op het land en in de zomer
        scheurt de grond open. Kommen waren te nat voor akkers en bleven eeuwenlang
        grasland, moeras en broekbos, met wilgengrienden en elzen op de natste plekken.
      versterken:
        - "Kies soorten die zware, natte klei verdragen: zwarte els, schietwilg, gelderse roos, sporkehout en eenstijlige meidoorn."
        - "Zet knotwilgen langs sloten en kavelgrenzen; die passen bij dit natte deel van het rivierenland."
        - "Plant iets verhoogd of op een lichte rug waar water blijft staan, zodat de wortelhals niet verdrinkt."
        - "Werk nooit op natte klei. Verdichte komklei herstelt zich jarenlang niet."
        - "Houd de openheid van de kom in stand; plant in lijnen langs de kavelgrenzen en niet in blokken midden in het veld."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: uiterwaard
      match_exact: []
      match: ["uiterwaard", "overstromingsvlakte", "actieve rivier", "buitendijks", "kronkelwaard"]
      titel: "Uiterwaard"
      ontstaan: >-
        De uiterwaard is het land tussen de rivier en de dijk. Sinds de bedijking is dit
        het enige deel van het rivierengebied dat nog regelmatig overstroomt. Bij elk
        hoogwater komt er water overheen dat zand en klei achterlaat, waardoor het
        landschap blijft veranderen: er ontstaan zandige ruggen, kleiige laagten,
        strangen en oude geulen. Door dat wisselende beeld staan droge en natte plekken
        hier vaak vlak naast elkaar. Uiterwaarden werden gebruikt als hooiland, wilgengriend
        en steenfabriekterrein.
      versterken:
        - "Overleg altijd eerst met de rivierbeheerder en het waterschap. In de uiterwaard gelden strikte regels, omdat beplanting de waterafvoer remt."
        - "Kies soorten die overstroming verdragen: schietwilg, zwarte els, zwarte populier en gelderse roos."
        - "Griend en knotwilgen zijn hier de meest passende vormen; ze blijven laag en houden water minder tegen dan opgaand bos."
        - "Plant in de stroomrichting van de rivier, niet dwars erop, zodat het water bij hoogwater door kan."
        - "Laat oude strangen en laagtes open; ze zijn belangrijk voor vissen, amfibieën en vogels."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: rivierterras
      match_exact: []
      match: ["terrasrest", "rivierterras", "terras", "terrasglooiing", "terrassenlandschap"]
      titel: "Rivierterras of terrasrest"
      ontstaan: >-
        Een rivierterras is een oude rivierbedding die nu hoog en droog in het landschap
        ligt. Tijdens de ijstijden wisselden koude en warme perioden elkaar af. In de
        koude tijden vulde de rivier haar dal op met zand en grind; in de warme tijden
        sneed ze zich er juist weer in. Wat na elke insnijding aan de zijkant bleef
        liggen, is een terras. Zo ontstond een trap van steeds oudere en hoger gelegen
        vlakken langs Maas en Rijn. De bovengrond bestaat vaak uit grof zand en grind,
        soms met een laag löss of leem erop, en is meestal droog en doorlatend.
      versterken:
        - "Kies soorten die droogte en grind aankunnen: zomereik, wintereik, ruwe berk, sleedoorn, eenstijlige meidoorn en hondsroos."
        - "Plant een houtwal of struweelhaag langs de terrasrand; dat maakt de trapvorm in het landschap zichtbaar."
        - "Kies waar een leem- of losslaag ligt juist rijkere soorten: haagbeuk, veldesdoorn en hazelaar."
        - "Houd de steilranden tussen twee terrassen begroeid; ze zijn erosiegevoelig en waardevol als warme, zonnige rand."
        - "Bemest niet op de grindige delen; droge, schrale terrassen zijn juist rijk aan bijzondere insecten."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: strandwal_strandvlakte
      match_exact: []
      match: ["strandwal", "strandvlakte", "oude duinen", "strandwallen"]
      titel: "Strandwal of strandvlakte"
      ontstaan: >-
        Toen de zeespiegel na de laatste ijstijd steeg, bouwde de zee langs de kust
        zandruggen op: strandwallen. Achter elke wal ontstond een lagere, nattere
        strandvlakte. Doordat de kustlijn zich stap voor stap zeewaarts verplaatste,
        ontstond een reeks evenwijdige ruggen en vlaktes. Op de droge strandwallen
        kwamen de oudste dorpen, wegen en later de landgoederen en bollenvelden; in de
        natte strandvlaktes groeide veen en lag weiland. De kalk is uit de bovengrond
        van deze oude wallen grotendeels weggespoeld, waardoor de grond er zuurder is
        dan in de jonge duinen.
      versterken:
        - "Kies op de droge strandwal soorten van zandgrond: zomereik, ruwe berk, hazelaar, lijsterbes en hulst."
        - "Kies in de lagere strandvlakte natte soorten: zwarte els, schietwilg, gelderse roos en sporkehout."
        - "Plant in de lengterichting van de wallen; het evenwijdige patroon is hier het kenmerk van het landschap."
        - "Leg langs de oude wegen een bomenrij of laan aan; dat past bij de bewoningsgeschiedenis van de wal."
        - "Houd de overgang tussen wal en vlakte zichtbaar met een struweelrand in plaats van een strakke grens."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: kustduinen
      match_exact: []
      match: ["kustduin", "jonge duinen", "duinvallei", "duincomplex", "zeeduinen", "duinen en"]
      titel: "Kustduinen"
      ontstaan: >-
        De zee bracht eeuwenlang zand naar het strand en de wind blies dat landinwaarts.
        Zo groeiden hoge duinen, die vanaf ongeveer duizend jaar geleden over de oudere
        strandwallen heen zijn geschoven. Het zand bevat kalk uit vergruisde schelpen,
        maar die kalk spoelt geleidelijk uit de bovengrond weg. In de laagtes tussen de
        duinen, de duinvalleien, komt het grondwater dicht aan de oppervlakte; daar is
        het vochtig en soms kalkrijk. Duinen zijn altijd in beweging: wind, zout en
        droogte bepalen wat er kan groeien.
      versterken:
        - "Kies zout- en windverdragende struiken: duindoorn, wilde liguster, eenstijlige meidoorn, kruipwilg, duinroos en vlier."
        - "Houd de beplanting laag en gesloten; hoge losse bomen overleven de zeewind zelden."
        - "Plant aan de landzijde van het erf en laat de zeezijde laag of open."
        - "Vermijd woekeraars die in de duinen problemen geven, zoals rimpelroos en Amerikaanse vogelkers."
        - "Laat vochtige duinvalleien open; daar horen lage, kruidenrijke begroeiing en geen bomen."
        - "Bemest niet en geef geen water; schraalte hoort bij dit landschap."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: getijdenvlakte_kwelder
      match_exact: []
      match: ["getijde-afzettingsvlakte", "getijdenvlakte", "kwelder", "schor", "wadplaat", "slik", "getijdeafzetting", "getijde"]
      titel: "Getijdenvlakte of kwelder"
      ontstaan: >-
        Dit gebied is opgebouwd door eb en vloed. Bij elke vloed stroomde zeewater het
        gebied in en liet slib achter; laag na laag hoogde het land daardoor op. Zolang
        het nog vaak overstroomde bleef het kaal slik. Werd het hoger, dan vestigden
        zich zoutplanten en ontstond een kwelder of schor, doorsneden door kronkelende
        kreken. Veel van deze gebieden zijn later bedijkt en zijn nu polder, maar het
        oude patroon van kreken en hoogteverschillen is vaak nog zichtbaar. De bodem is
        kalkrijk en kan nog zout bevatten.
      versterken:
        - "Houd rekening met zout in de bodem, ook als het gebied al lang bedijkt is."
        - "Kies robuuste soorten die zout en wind verdragen: duindoorn, vlier, eenstijlige meidoorn en schietwilg."
        - "Concentreer beplanting op het erf en langs de dijkvoet; het open veld hoort hier open te blijven."
        - "Volg met de beplanting het oude krekenpatroon of de kavelgrenzen in plaats van een rechte lijn dwars door het veld."
        - "Plant een gelaagde, dichte singel als windvang, met de laagste struiken aan de windzijde."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: ontgonnen_veenvlakte
      match_exact: []
      match: ["ontgonnen veenvlakte", "veenkolon", "ontgonnen hoogveen", "afgegraven veen", "verveend"]
      titel: "Ontgonnen veenvlakte"
      ontstaan: >-
        Hier lag ooit een dik pakket veen. Vanaf de zeventiende eeuw is dat op grote
        schaal afgegraven voor turf, de belangrijkste brandstof van die tijd. Er werden
        kanalen en wijken gegraven om het veen af te voeren, en het gebied werd
        systematisch afgewerkt. Wat overbleef was de zandondergrond met een restje veen
        erop, dat werd gemengd tot dalgrond en in cultuur gebracht. Het resultaat is een
        heel regelmatig, open landschap met rechte kanalen, lange smalle kavels en
        lintdorpen langs de vaarten. De bodem is arm, vaak zuur en gevoelig voor droogte.
      versterken:
        - "Volg met beplanting het strakke patroon van kanalen, wijken en wegen; de rechtlijnigheid is hier de identiteit."
        - "Leg een singel of laanbeplanting aan langs het kanaal of de weg, in plaats van losse groepen in het veld."
        - "Kies soorten voor arme, wisselend vochtige grond: zwarte els, ruwe berk, zachte berk, zomereik en lijsterbes."
        - "Houd de openheid van het middenveld in stand; de wijdsheid hoort bij dit landschap."
        - "Verbeter bij aanplant de bodemstructuur van dalgrond, maar bemest niet zwaar; dat spoelt hier snel uit."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: droogmakerij
      match_exact: []
      match: ["droogmakerij", "drooggemaakt", "meerbodem", "polder met", "drooggelegde"]
      titel: "Droogmakerij"
      ontstaan: >-
        Dit was ooit een meer of een plas. Op veel plaatsen ontstonden die doordat er
        veen was weggegraven of doordat golfslag het veen wegsloeg; het water breidde
        zich uit en bedreigde de omgeving. Vanaf de zeventiende eeuw zijn zulke meren
        met molens en later met gemalen drooggemalen. Wat tevoorschijn kwam was de oude
        meerbodem: vlakke, vaak zware klei die meters lager ligt dan het omringende land.
        Droogmakerijen zijn daardoor herkenbaar aan hun ringdijk, hun ringvaart, hun
        rechte wegen en hun strakke, rechthoekige verkaveling.
      versterken:
        - "Volg met beplanting het rechthoekige patroon van wegen en tochten; de strakke maat is hier het kenmerk."
        - "Leg een erfsingel of een laan aan; losse groepen midden in de polder passen niet bij het beeld."
        - "Kies soorten voor natte, zware klei: schietwilg, zwarte els, eenstijlige meidoorn, vlier en fladderiep."
        - "Houd rekening met een hoge grondwaterstand en soms brak of zout kwelwater; plant zo nodig op een lichte verhoging."
        - "Houd de openheid in het midden van de polder in stand en concentreer beplanting bij erven en langs de randen."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: veenvlakte
      match_exact: []
      match: ["veenvlakte", "veenrest", "hoogveen", "laagveen", "veenkussen", "veen"]
      titel: "Veenvlakte of veenrest"
      ontstaan: >-
        Op deze plek heeft zich veen gevormd: plantenresten die in een nat, zuurstofarm
        milieu niet volledig verteerden en zich eeuw na eeuw opstapelden. In laagveen
        gebeurde dat onder invloed van grondwater, in hoogveen alleen door regenwater,
        waardoor die laatste heel arm en zuur is. Vrijwel overal is het veen later
        ontwaterd of afgegraven, waardoor het is ingeklonken en de bodem is gedaald.
        Wat nu nog als veenvlakte of veenrest op de kaart staat, is meestal een dunner
        pakket dan vroeger. De grond is licht, zuur en houdt veel water vast.
      versterken:
        - "Kies soorten die natte, zure grond verdragen: zwarte els, zachte berk, schietwilg, grauwe wilg, geoorde wilg en sporkehout."
        - "Verlaag het waterpeil niet. Ontwatering laat het resterende veen verteren en de bodem verder zakken."
        - "Kies passende vormen: elzensingel, knotwilgen en griend horen bij dit natte landschap."
        - "Plant ondiep en niet te dicht bij gebouwen; bomen op veen wortelen ondiep en waaien eerder scheef."
        - "Laat natte laagtes en veenputjes open; die zijn waardevol voor libellen, amfibieën en moerasvogels."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: gmm_antropogeen
      match_exact: []
      match: ["antropogeen", "opgehoogd", "vergraven", "bebouwing", "opgespoten", "afgegraven", "terp", "wierde", "stort", "dijk"]
      titel: "Door mensen gemaakt terrein"
      ontstaan: >-
        De oorspronkelijke landvorm is hier door mensen veranderd of helemaal verdwenen.
        Dat kan gaan om bebouwing, om opgehoogd of opgespoten terrein, om afgraving, om
        een dijk of om een terp of wierde: een kunstmatige woonheuvel die mensen vóór de
        bedijking opwierpen om droog te wonen. De bodem bestaat op zulke plekken vaak uit
        aangevoerd materiaal en is soms verdicht of vermengd met puin. De kaart zegt hier
        dus meer over de menselijke ingreep dan over de natuurlijke ondergrond.
      versterken:
        - "Onderzoek de bodem ter plekke met een proefgat; op opgehoogd terrein wijkt de werkelijkheid vaak sterk af van de kaart."
        - "Let op verdichting en puin. Breek verdichte lagen open of kies een andere plantplaats voordat je grote bomen zet."
        - "Kies soorten die veel verdragen: veldesdoorn, eenstijlige meidoorn, vlier, zomereik en fladderiep."
        - "Sluit met vorm en soortkeuze aan bij het omringende landschap, ook als de ondergrond hier kunstmatig is."
        - "Zorg voor voldoende doorwortelbare ruimte; dat is in bebouwd gebied meestal de beperkende factor, niet de soort."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

    - id: onbekend
      match_exact: []
      match: []
      titel: "Landvorm onbekend"
      ontstaan: >-
        Voor deze plek geeft de geomorfologische kaart geen landvorm. Dat komt voor bij
        open water, in bebouwd gebied en op plekken waar het reliëf is vergraven. Het
        verhaal over de vorm van het landschap ontbreekt hier dus, maar de bodemsoort,
        de vochtklasse en de regio geven samen nog steeds een bruikbaar beeld.
      versterken:
        - "Kijk naar het reliëf in het veld: ligt deze plek hoog of laag ten opzichte van de omgeving?"
        - "Gebruik de bodemsoort en de vochtklasse als leidraad voor je soortkeuze."
        - "Sluit met de vorm van de beplanting aan bij wat in de directe omgeving gebruikelijk is."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); eigen bewerking"

