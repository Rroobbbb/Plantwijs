        - "Maak de overgang van bos naar open terrein geleidelijk met een mantel van struiken en een kruidenzoom."
        - "Let op leemlagen in de ondergrond; waar water blijft staan passen zachte berk en sporkehout beter."
        - "Laat oude, dikke bomen en dood hout staan; op de stuwwal zijn dat de rijkste plekken voor paddenstoelen, insecten en vogels."
