# PlantWijs — kennislaag: landschapsverhalen per kaartwaarde
# Zie content/README.md voor de matchconventie en het toevoegen van entries.
meta:
  versie: "2026-08-10"
  doel: >-
    Kennislaag voor locatie-adviezen: per kaartwaarde een uitleg over ontstaan
    en versterking van het landschap.
  disclaimer: >-
    Indicatief; gebaseerd op kaartinterpretatie op regioschaal. Lokale situatie kan afwijken.
  taalniveau: "B1 (bewoners zonder voorkennis)"
  matchconventie: >-
    Per entry gelden twee sleutels. 'match_exact' bevat volledige kaartwaarden in
    kleine letters; 'match' bevat deelteksten in kleine letters. Aanbevolen volgorde
    voor de matcher: normaliseer de kaartwaarde (trim, kleine letters), probeer
    eerst alle match_exact-waarden binnen de categorie, daarna alle match-waarden
    in bestandsvolgorde. De eerste treffer wint, dus specifieke entries staan boven
    algemene. Een entry met lege 'match' en lege 'match_exact' is de fallback en
    wordt alleen gebruikt als niets anders matcht.
  velden:
    id: "stabiele sleutel; wordt door maatregelen.yaml gebruikt in past_bij"
    titel: "kopregel voor de gebruiker"
    ontstaan: "hoe dit landschap is ontstaan, 3-6 zinnen"
    versterken: "concrete maatregelen die een bewoner zelf kan nemen"
    bron: "herkomst van de kaartwaarde"

categorieen:

  # ==========================================================================
  # FGR — Fysisch-Geografische Regio's (PDOK WFS, property 'fgr')
  # ==========================================================================
  fgr:
    - id: hogere_zandgronden
      match_exact: ["hogere zandgronden"]
      match: ["hogere zandgronden", "zandgronden"]
      titel: "Hogere zandgronden"
      ontstaan: >-
        In de laatste ijstijden was Nederland koud en vrijwel kaal. De wind had
        vrij spel en blies grote hoeveelheden zand over het land. Dat zand, dekzand,
        legde zich neer als lage ruggen en vlakke velden; dat reliëf zie je hier nog
        steeds terug. Het zand is arm aan voedingsstoffen en houdt weinig water vast.
        Onder heide en bos vormde zich in de bodem een podzol: een grijze laag waaruit
        stoffen zijn weggespoeld, met daaronder een donkere laag waarin ijzer en humus
        zijn vastgelegd. Boeren woonden op de droge ruggen en brachten daar eeuwenlang
        plaggen en mest op hun akkers, waardoor een dik donker esdek groeide; de lagere
        en nattere delen bleven heide en woeste grond tot ze in de negentiende en
        twintigste eeuw werden ontgonnen tot akker, weiland en bos.
      versterken:
        - "Leg een houtwal of houtsingel aan langs de perceelrand. Dat is hier van oudsher de manier om een erf of akker af te bakenen."
        - "Kies soorten die met arme, droge grond overweg kunnen: zomereik, ruwe berk, lijsterbes, hazelaar en sporkehout."
        - "Plant een of enkele solitaire eiken bij het erf. Oude, vrijstaande eiken zijn het beeldmerk van dit landschap en leveren veel op voor insecten en vogels."
        - "Maak aan de zonzijde van de beplanting een kruidenrijke zoom van twee tot vier meter breed. Maai die één keer per jaar en voer het maaisel af."
        - "Bemest niet en breng geen tuinaarde aan. De schraalheid hoort bij dit landschap en levert juist de meeste bloemen en insecten op."
        - "Laat dood hout liggen en stapel snoeihout op tot een takkenril langs de houtwal."
      bron: "FGR (PDOK); eigen bewerking"

    - id: heuvelland
      match_exact: ["heuvelland"]
      match: ["heuvelland", "heuvelrug limburg", "zuid-limburg"]
      titel: "Heuvelland"
      ontstaan: >-
        In Zuid-Limburg ligt kalksteen betrekkelijk dicht onder de oppervlakte. Die
        kalk is gevormd in een warme, ondiepe zee, lang vóór de ijstijden. De Maas en
        haar zijrivieren hebben zich er in de loop van honderdduizenden jaren doorheen
        gesneden en lieten terrassen achter: oude rivierbeddingen die nu hoog in het
        landschap liggen. Tijdens de ijstijden waaide er bovenop een fijn, vruchtbaar
        stof neer: löss. Löss is goed bewerkbaar maar spoelt gemakkelijk weg op een
        helling, en daarom legden boeren graften aan: begroeide steilrandjes dwars op
        de helling die de afspoelende grond tegenhouden. Hoogstamboomgaarden rond de
        dorpen en diep uitgesleten holle wegen horen bij hetzelfde beeld.
      versterken:
        - "Herstel of plant een graft: een strook struiken en bomen dwars op de helling, die afspoelende grond opvangt en de helling vasthoudt."
        - "Leg een hoogstamboomgaard aan met appel, peer, pruim en kers, met grasland of begrazing eronder."
        - "Gebruik struiken van kalkrijke grond: gele kornoelje, rode kornoelje, wollige sneeuwbal, wegedoorn, zuurbes en eenstijlige meidoorn."
        - "Plant een walnoot of tamme kastanje bij het erf; die staan hier van oudsher bij de boerderijen."
        - "Laat de zomen langs holle wegen en graften met rust. Maai hooguit één keer per jaar en voer het maaisel af."
        - "Kies bij een haag voor haagbeuk of veldesdoorn in plaats van een strakke conifeer; die passen bij de streek en zijn veel waardevoller voor dieren."
      bron: "FGR (PDOK); eigen bewerking"

    - id: rivierengebied
      match_exact: ["rivierengebied"]
      match: ["rivierengebied", "rivierkleigebied", "rivieren"]
      titel: "Rivierengebied"
      ontstaan: >-
        Rijn en Maas hebben dit landschap gemaakt. Bij hoogwater traden de rivieren
        buiten hun oevers. Vlak langs de stroom bleef het grovere materiaal liggen,
        zand en zavel, en daar groeiden hoge, droge oeverwallen en stroomruggen.
        Verder van de rivier bezonk alleen nog fijne klei; dat werden de lage, natte
        kommen. Mensen gingen wonen en boeren op de oeverwallen, met boomgaarden,
        hagen en akkers, terwijl de kommen grasland, wilg en els bleven. Vanaf de
        middeleeuwen zijn er dijken aangelegd; sindsdien overstroomt alleen nog het
        gebied buitendijks, de uiterwaard.
      versterken:
        - "Plant een meidoornhaag als erfgrens of veekering op de hogere oeverwal. Dat is hier de klassieke perceelscheiding."
        - "Leg een hoogstamboomgaard aan op de oeverwal; de grond is daar van nature geschikt en boomgaarden horen bij het streekbeeld."
        - "Zet knotwilgen langs een sloot of kavelgrens en knot ze om de drie tot vijf jaar."
        - "Kies in de lage, natte kom voor zwarte els, schietwilg en gelderse roos in plaats van soorten van droge grond."
        - "Combineer een haag met een brede bloemrijke zoom aan de zonzijde; dat levert veel op voor insecten, vogels en kleine zoogdieren."
        - "Informeer bij het waterschap voordat je in de uiterwaard of vlak langs een watergang plant; daar gelden vaak beperkingen vanwege de waterafvoer."
      bron: "FGR (PDOK); eigen bewerking"

    - id: zeekleigebied
      match_exact: ["zeekleigebied"]
      match: ["zeekleigebied", "zeeklei"]
      titel: "Zeekleigebied"
      ontstaan: >-
        Dit land stond lange tijd onder invloed van de zee. Bij elke vloed kwam er
        water binnen dat slib meebracht, en dat slib bezonk laag na laag als klei.
        Zo groeide een vlak en vruchtbaar landschap dat langzaam boven water uit
        kwam. Geulen en kreken raakten opgevuld met zand; omdat het zand minder
        inklinkt dan klei liggen die oude geulen nu vaak juist iets hoger in het veld,
        als kreekruggen. Vanaf de middeleeuwen legden mensen dijken aan en polderden
        ze stuk voor stuk gebieden in. Het resultaat is een open landschap met rechte
        kavels, brede sloten en weinig opgaand groen.
      versterken:
        - "Houd de openheid in stand: concentreer beplanting op en rond het erf en niet midden in het open veld."
        - "Leg een erfsingel aan aan de wind- en noordzijde van het erf; een dichte, gelaagde singel is hier de gebruikelijke vorm."
        - "Kies soorten die zware klei en wind verdragen: schietwilg, fladderiep, gladde iep, eenstijlige meidoorn en vlier."
        - "Plant een enkele grote solitaire boom of een kleine boomgroep bij de oprit als markering van het erf."
        - "Maak een kruidenrijke rand langs de sloot; die verbindt het erf met het slotenpatroon van de polder."
        - "Vermijd soorten van arme zandgrond en van zure bodems; op kalkrijke, zware klei komen die niet tot hun recht."
      bron: "FGR (PDOK); eigen bewerking"

    - id: laagveengebied
      match_exact: ["laagveengebied"]
      match: ["laagveengebied", "laagveen"]
      titel: "Laagveengebied"
      ontstaan: >-
        Achter de duinen en de oude kwelders bleef water staan. Planten die daarin
        groeiden verteerden niet volledig, omdat er in dat natte, zuurstofarme milieu
        nauwelijks afbraak plaatsvindt. Zo stapelde zich duizenden jaren lang veen op:
        een dikke laag half verteerd plantenmateriaal. Vanaf de middeleeuwen groeven
        mensen sloten om het veen te ontwateren en er te kunnen boeren, maar door die
        ontwatering klonk het veen in en zakte het land. Later is er op veel plaatsen
        veen gebaggerd voor turf, waardoor petgaten en plassen ontstonden. Wat overbleef
        is een nat, open landschap met lange smalle kavels en heel veel water.
      versterken:
        - "Plant elzensingels langs de kavelsloten. Dat is hier de klassieke lijn in het landschap en het houdt de smalle verkaveling zichtbaar."
        - "Kies soorten die natte voeten verdragen: zwarte els, schietwilg, grauwe wilg, geoorde wilg, gelderse roos en sporkehout."
        - "Zet knotwilgen langs de sloot en knot ze in cyclus; oude knotwilgen leveren nestholtes op voor vogels en vleermuizen."
        - "Plant in lijnen langs de kavelrichting en niet in blokken; de lange strookvormige verkaveling is het kenmerk van dit gebied."
        - "Houd afstand tot de slootkant en stem het onderhoudspad af met het waterschap voordat je plant."
        - "Laat oevers gefaseerd staan: maai niet alles tegelijk, zodat riet- en ruigtezomen blijven bestaan voor vogels en insecten."
      bron: "FGR (PDOK); eigen bewerking"

    - id: duinen
      match_exact: ["duinen"]
      match: ["duinen", "duingebied", "duin"]
      titel: "Duinen"
      ontstaan: >-
        De Noordzee heeft eeuwenlang zand naar de kust gebracht, en de wind blies dat
        zand landinwaarts tot duinen. De oudste en laagste duinen liggen het verst van
        zee; de hoge duinen langs de kustlijn zijn veel jonger. Het duinzand bevat kalk
        uit vergruisde schelpen, maar die kalk spoelt in de loop van de eeuwen uit de
        bovengrond weg. Daardoor is de bodem in de oude duinen zuur en arm, terwijl de
        jonge duinen dichter bij zee nog kalkrijk zijn. In de laagtes tussen de duinen
        komt het grondwater dicht aan de oppervlakte, waardoor daar juist vochtige en
        soms kalkrijke omstandigheden heersen.
      versterken:
        - "Gebruik struiken die zout en wind verdragen: duindoorn, wilde liguster, eenstijlige meidoorn, vlier, kruipwilg en duinroos."
        - "Houd de beplanting laag en gesloten. Losse, hoge bomen waaien in de zeewind snel scheef of sterven af aan de zeezijde."
        - "Plant aan de luwe kant van het erf en laat de zeezijde open of laag begroeid."
        - "Vermijd soorten die zich in de duinen agressief uitbreiden, zoals rimpelroos, Amerikaanse vogelkers en pontische rododendron."
        - "Bemest niet en geef geen extra water. De duinbodem hoort schraal en droog te zijn; juist daar horen de bijzondere soorten."
        - "Laat open zand en korte, schrale vegetatie waar mogelijk in stand; veel duinsoorten hebben kaal, stuivend zand nodig."
      bron: "FGR (PDOK); eigen bewerking"

    - id: getijdengebied
      match_exact: ["getijdengebied"]
      match: ["getijdengebied", "getijde", "waddengebied", "wadden"]
      titel: "Getijdengebied"
      ontstaan: >-
        Hier bepalen eb en vloed nog altijd het landschap. Twee keer per dag stroomt
        zeewater het gebied in en weer uit. Bij elke vloed bezinkt slib op de platen en
        langs de randen, waardoor kale slikken langzaam ophogen tot kwelders en schorren
        die begroeid raken met zoutplanten. Geulen blijven open doordat het water er met
        kracht doorheen stroomt. Waar mensen dijken aanlegden viel het land droog en werd
        het polder, maar buitendijks werkt het systeem nog volop: daar groeit en verandert
        het land voortdurend.
      versterken:
        - "Houd het buitendijkse gebied vrij van beplanting. Kwelder, slik en open water horen daar; beplanting hoort bij het erf en de dorpsrand."
        - "Kies binnendijks soorten die veel wind en zout in de lucht verdragen: duindoorn, vlier, eenstijlige meidoorn, schietwilg en gewone esdoorn."
        - "Leg een dichte, gelaagde erfsingel aan als windvang. Wind en zoutnevel zijn hier de grootste beperking, niet de bodem."
        - "Gebruik de buitenste rij struiken als schild: laat die laag en dicht, met daarachter geleidelijk hogere beplanting."
        - "Overleg altijd met de waterbeheerder voordat je op of vlak bij een dijk plant."
        - "Houd het zicht op dijk, wad en water vrij; de wijdheid is hier het kenmerk van het landschap."
      bron: "FGR (PDOK); eigen bewerking"

    - id: afgesloten_zeearmen
      match_exact: ["afgesloten zeearmen"]
      match: ["afgesloten zeearmen", "zeearmen", "zeearm"]
      titel: "Afgesloten zeearmen"
      ontstaan: >-
        Dit waren open zeearmen waar eb en vloed vrij spel hadden. Na de watersnoodramp
        van 1953 zijn ze met dammen en keringen afgesloten. Daardoor verdween het getij
        grotendeels en veranderde het water op veel plaatsen van zout in brak of zoet.
        De oude platen, slikken en geulen liggen er nog, maar worden niet meer elke dag
        overstroomd. Langs de randen is nieuw land en nieuwe natuur ontstaan. Het is
        daardoor een jong, open en waterrijk landschap.
      versterken:
        - "Houd rekening met zout in de ondergrond. Ook waar het oppervlaktewater nu zoet is, kan de bodem nog brak zijn."
        - "Kies voor de buitenste rij robuuste soorten die zout en wind verdragen: duindoorn, vlier, eenstijlige meidoorn en schietwilg."
        - "Plant als brede singel of als bosje bij het erf. Losse bomen in de volle wind hebben het hier zwaar."
        - "Gebruik een kruidenrijke zoom als geleidelijke overgang van de beplanting naar het open land."
        - "Ga na of de grond opgespoten is. Opgespoten zand is meestal arm en droog en vraagt andere soorten dan de omliggende klei."
        - "Kies op de hoge, droge zandplaten geen soorten die veel water en een rijke bodem vragen."
      bron: "FGR (PDOK); eigen bewerking"

    - id: fgr_niet_ingedeeld
      match_exact: ["niet ingedeeld", "noordzee"]
      match: ["niet ingedeeld", "noordzee", "buitenland"]
      titel: "Niet ingedeeld of open water"
      ontstaan: >-
        Deze plek valt buiten de indeling in fysisch-geografische regio's. Dat gebeurt
        bij open zee, bij grote wateren en soms bij recent opgespoten of aangelegd land.
        Er is dan geen landschapsverhaal op regioschaal te geven. De andere kaartlagen,
        zoals bodem, grondwatertrap en geomorfologie, zeggen op zo'n plek meestal meer.
      versterken:
        - "Kijk naar de bodemsoort en de vochtklasse van deze plek; die geven de beste aanwijzing voor wat er kan groeien."
        - "Kijk ook naar het landschap in de directe omgeving en sluit met vorm en soortkeuze daarbij aan."
        - "Bij recent opgespoten of aangevoerde grond: laat de bodem eerst onderzoeken voordat je grote beplanting aanlegt."
      bron: "FGR (PDOK); eigen bewerking"

    - id: onbekend
      match_exact: []
      match: []
      titel: "Regio onbekend"
      ontstaan: >-
        Voor deze plek is geen fysisch-geografische regio bekend. Dat kan komen doordat
        de kaartlaag hier geen waarde geeft of doordat de bron tijdelijk niet bereikbaar
        was. Het landschapsverhaal op regioschaal ontbreekt dus, maar de overige
        gegevens over deze plek blijven bruikbaar.
      versterken:
        - "Gebruik de bodemsoort en de vochtklasse als basis voor je soortkeuze."
        - "Kijk in de omgeving welke beplantingsvormen er van oudsher voorkomen: houtwallen, singels, hagen of boomgaarden."
        - "Kies bij twijfel voor inheemse soorten uit de streek; die passen vrijwel altijd."
      bron: "FGR (PDOK); eigen bewerking"

  # ==========================================================================
  # BODEM — gecanoniseerde bodemsoort (BRO Bodemkaart via WMS)
  # ==========================================================================
  bodem:
    - id: zand
      match_exact: ["zand"]
      match: ["zand", "podzol", "duinvaag", "vlakvaag", "haarpodzol", "veldpodzol", "enkeerd"]
      titel: "Zandgrond"
      ontstaan: >-
        Zandgrond bestaat uit losse, betrekkelijk grove korrels. Het meeste zand in
        Nederland is door wind of door rivieren aangevoerd tijdens en na de ijstijden.
        Tussen de korrels zitten grote poriën, waardoor regenwater snel wegzakt en de
        grond snel opdroogt. Ook voedingsstoffen spoelen makkelijk uit. Zandgrond is
        daarom van nature schraal en vaak zuur, maar wel goed doorlucht en gemakkelijk
        doorwortelbaar.
      versterken:
        - "Kies soorten die droogte en armoede aankunnen, zoals zomereik, ruwe berk, lijsterbes, hazelaar en sporkehout."
        - "Plant bij voorkeur in het najaar, zodat de wortels zich kunnen vestigen voordat de zomerdroogte komt."
        - "Houd de bodem bedekt met bladeren, strooisel of houtsnippers. Dat beperkt verdamping en bouwt langzaam humus op."
        - "Geef de eerste twee groeiseizoenen water bij aanhoudende droogte; daarna moet de beplanting het zelf redden."
        - "Bemest niet zwaar. De waarde van zandgrond zit juist in de schraalheid en de soorten die daarbij horen."
      bron: "BRO Bodemkaart (PDOK); eigen bewerking"

    - id: klei
      match_exact: ["klei"]
      match: ["klei", "zavel", "poldervaag", "kalkrijke", "kalkarme", "drechtvaag", "nesvaag", "ooivaag"]
      titel: "Kleigrond"
      ontstaan: >-
        Klei bestaat uit heel fijne deeltjes die in stilstaand of langzaam stromend
        water zijn bezonken. In Nederland is klei afgezet door de zee, door rivieren
        of in oude meren. De deeltjes zijn zo klein dat ze water en voedingsstoffen
        goed vasthouden; daardoor is kleigrond vruchtbaar. Keerzijde is dat er weinig
        lucht in de grond zit: natte klei is zwaar en kan dichtslaan, en in een droge
        zomer krimpt hij en scheurt hij open.
      versterken:
        - "Kies soorten die zware, natte grond verdragen, zoals schietwilg, zwarte els, eenstijlige meidoorn, vlier en fladderiep."
        - "Werk nooit op natte klei. Rijden of lopen over natte grond drukt hem samen en dat herstelt jarenlang niet."
        - "Maak een ruim plantgat, maar vul het met de eigen grond en niet met losse potgrond; anders blijft water in het gat staan."
        - "Plant iets hoger dan het maaiveld op plekken waar water blijft staan, zodat de wortelhals niet verdrinkt."
        - "Houd de grond bedekt met een laag organisch materiaal; dat verbetert de structuur en houdt de bovenlaag luchtig."
      bron: "BRO Bodemkaart (PDOK); eigen bewerking"

    - id: leem
      match_exact: ["leem", "löss", "loss", "zavel"]
      match: ["leem", "löss", "loss", "silt", "brikgrond", "radebrik", "bergbrik"]
      titel: "Leem- en lössgrond"
      ontstaan: >-
        Leem en löss zitten qua korrelgrootte tussen zand en klei in. Löss is tijdens
        de ijstijden als fijn stof door de wind aangevoerd en ligt vooral in Zuid-Limburg;
        leem komt daarnaast voor in beekdalen en op plekken waar smeltwater fijn materiaal
        heeft afgezet. Deze grond houdt water goed vast en is vruchtbaar en goed
        bewerkbaar. Tegelijk slaat hij makkelijk dicht bij een felle bui en spoelt hij
        op hellingen snel weg.
      versterken:
        - "Kies soorten die een vruchtbare, vochthoudende bodem waarderen: haagbeuk, winterlinde, veldesdoorn, hazelaar en gele kornoelje."
        - "Houd de bodem bedekt. Kale löss- en leemgrond spoelt bij een zware bui zo weg."
        - "Plant op een helling dwars op het verhang, zodat de beplanting afstromend water en grond opvangt."
        - "Vermijd zware machines op natte grond; leem verdicht snel en dan komt er geen lucht meer bij de wortels."
        - "Voeg een struiklaag en een kruidenzoom toe. Op deze rijke grond geeft gelaagde beplanting de meeste variatie."
      bron: "BRO Bodemkaart (PDOK); eigen bewerking"

    - id: veen
      match_exact: ["veen", "moerige grond"]
      match: ["veen", "moerig", "koopveen", "waardveen", "vlierveen", "weideveen", "madeveen"]
      titel: "Veengrond"
      ontstaan: >-
        Veen bestaat uit plantenresten die nooit helemaal zijn verteerd. In water zonder
        zuurstof stopt de afbraak, waardoor het materiaal zich eeuw na eeuw opstapelt.
        Zo zijn in Nederland dikke veenpakketten gegroeid, in laagveengebieden onder
        invloed van grondwater en in hoogvenen door regenwater. Veengrond is licht,
        sponzig en zuur, en houdt enorm veel water vast. Zodra veen wordt ontwaterd
        komt er zuurstof bij, gaat het alsnog verteren en zakt de bodem; dat heet
        bodemdaling en het gebeurt nog altijd.
      versterken:
        - "Kies soorten die natte voeten verdragen: zwarte els, schietwilg, grauwe wilg, geoorde wilg, sporkehout en gelderse roos."
        - "Verlaag het waterpeil niet om te kunnen planten. Ontwatering laat het veen verteren en de bodem zakken."
        - "Plant niet te diep en houd de wortelhals op maaiveldhoogte; in een natte veenbodem is de doorwortelbare laag dun."
        - "Kies vormen die bij natte grond horen: elzensingels, knotwilgen en griend passen hier beter dan een strakke haag."
        - "Houd er rekening mee dat bomen op veen minder stevig wortelen en bij storm eerder scheefzakken; plant ze niet vlak bij gebouwen."
      bron: "BRO Bodemkaart (PDOK); eigen bewerking"

    - id: onbekend
      match_exact: []
      match: []
      titel: "Bodem onbekend"
      ontstaan: >-
        Voor deze plek geeft de bodemkaart geen bruikbare waarde. Dat komt vaak voor in
        bebouwd gebied, bij open water of op grond die is opgehoogd of vergraven. In
        stedelijk gebied is de bodem meestal een mengsel van aangevoerd zand, puin en
        oude grond, en dan zegt de kaart weinig.
      versterken:
