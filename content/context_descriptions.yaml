    - id: rivierduin_donk
      match_exact: []
      match: ["rivierduin", "donk", "rivierduinen en", "landduin op rivier"]
      titel: "Rivierduin of donk"
      ontstaan: >-
        Aan het einde van de laatste ijstijd stonden de rivieren in de zomer vol
        smeltwater en vielen ze in de winter grotendeels droog. Uit de kale, droge
        rivierbeddingen blies de wind zand op tot langgerekte duinen langs de oevers.
        Later, toen het klimaat opwarmde, groeide er veen en klei omheen, maar de
        zandkoppen bleven als hoge, droge plekken boven het natte land uitsteken.
        Zulke koppen heten donken; het grootste deel van het duin ligt daaronder nog
        begraven onder veen en klei. Ze waren eeuwenlang de enige droge plek in de
        omgeving en werden daarom al vroeg bewoond; vaak staan er nu nog een dorp of
        een boerderij op.
      versterken:
        - "Kies droogteverdragende soorten die bij zandgrond horen: zomereik, ruwe berk, hazelaar, sleedoorn en lijsterbes."
        - "Zet een solitaire eik of een kleine boomgroep op de kop; dat maakt de hoogte in het vlakke land zichtbaar."
        - "Houd de overgang van de droge kop naar het natte omringende land geleidelijk met een struweelrand."
        - "Kies aan de voet van de kop juist natte soorten: zwarte els, schietwilg en gelderse roos."
        - "Graaf niet af en hoog niet op; het hoogteverschil is hier de historische en landschappelijke waarde."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); Toelichting bij de legenda Geomorfologische kaart van Nederland 1:50.000 (WUR, 2017); Geologie van Nederland (TNO-GDN)"

    - id: oeverwal_stroomrug
      match_exact: []
      match: ["oeverwal", "stroomrug", "stroomruggen", "meanderruggen", "kronkelwaardrug"]
      titel: "Oeverwal of stroomrug"
      ontstaan: >-
        Als een rivier bij hoogwater buiten haar oevers trad, stroomde het water direct
        naast de bedding sterk af. Het grovere materiaal, zand en zavel, bleef daardoor
        vlak langs de rivier liggen en bouwde daar een langgerekte rug op. Zo'n oeverwal
        ligt hoger en droger dan het land erachter en is bovendien lichter en beter
        bewerkbaar. Dat maakte hem tot de aantrekkelijkste plek in het rivierengebied:
        dorpen, boerderijen, akkers en boomgaarden liggen er van oudsher op. Waar de
        rivier later verlegd is, ligt de oude stroomrug nog altijd als een flauwe
        verhoging in het land.
      versterken:
        - "Plant een meidoornhaag of struweelhaag als erfgrens; dat is hier de klassieke perceelscheiding."
        - "Leg een hoogstamboomgaard aan met appel, peer, pruim en kers. Op de oeverwal is dat van oudsher de plek."
        - "Kies soorten van rijke, goed doorlatende grond: zoete kers, walnoot, veldesdoorn, hazelaar en kardinaalsmuts."
        - "Zet een bomenrij of laan langs de weg of de oprit; die versterkt de lijn van de stroomrug."
        - "Houd het hoogteverschil met de lager gelegen kom zichtbaar en plant daar juist wilg en els."
