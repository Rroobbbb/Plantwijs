  nsn:
    - id: ontgonnen_hoogveen
      match_exact: ["ontgonnen hoogveen"]
      match: ["ontgonnen hoogveen", "veenkolon", "dalgrond"]
      titel: "Ontgonnen hoogveen"
      ontstaan: >-
        Hier lag ooit een dik hoogveenpakket. In de eerste helft van de zeventiende eeuw
        begon de grootschalige vervening voor turf, gefinancierd met Hollands kapitaal.
        Er werden kanalen en wijken gegraven, die zorgden voor de afwatering en waarover
        de turf werd afgevoerd. Wat overbleef was de zandondergrond, die met het restje
        bovenveen werd vermengd tot dalgrond en in cultuur gebracht. Het resultaat is een
        strak, open landschap met rechte kanalen, lange smalle kavels en lintbebouwing
        langs de vaart. De bodem is arm, zuur en gevoelig voor droogte.
      versterken:
        - "Volg met beplanting het rechte patroon van kanalen, wijken en wegen; die strakheid is de identiteit van dit landschap."
        - "Leg singels of een laanbeplanting aan langs de vaart of de weg, in plaats van losse groepen midden in het veld."
        - "Kies soorten voor arme, wisselend natte grond: zwarte els, zachte berk, ruwe berk, zomereik en lijsterbes."
        - "Houd de openheid van het middenveld in stand; de wijdsheid hoort hier bij."
        - "Bemest niet zwaar; op dalgrond spoelen voedingsstoffen snel uit naar het oppervlaktewater."
      bron: "BKNSN 2023 (code Hv2); RCE, Panorama Landschap - Veenkoloniën en Westerwolde"

    - id: hoogveen
      match_exact: ["hoogveen"]
      match: ["hoogveen", "veenmos"]
      titel: "Hoogveen"
      ontstaan: >-
        Hoogveen groeit alleen van regenwater. Veenmossen houden dat water als een
        spons vast en groeien aan de bovenkant door terwijl ze onderin afsterven zonder
        te verteren. Zo groeide het veen als een bolle kussen boven het grondwater uit,
        soms meters dik. Doordat er alleen regenwater in komt, is hoogveen extreem arm
        aan voedingsstoffen en sterk zuur. Vrijwel al het Nederlandse hoogveen is
        afgegraven of ontwaterd; wat er nog ligt is zeldzaam en kwetsbaar. Het systeem
        werkt alleen bij een permanent hoge waterstand.
      versterken:
        - "Plant hier geen bomen of struiken. Levend hoogveen hoort open te zijn; bomen verdampen water en drogen het veen uit."
        - "Verwijder opslag van berk en grove den als die zich in het veen vestigt; dat is hier juist beheerwerk."
        - "Ga zeer terughoudend om met ontwatering in de omgeving; hoogveen is volledig afhankelijk van een hoge waterstand."
        - "Leg beplanting op afstand aan, als bufferzone op de rand: zachte berk, sporkehout en geoorde wilg passen daar."
        - "Voer geen mest, bagger of grond aan in of nabij het veen; hoogveen verdraagt geen verrijking."
      bron: "BKNSN 2023 (code Hv1); natuurkennis.nl (OBN), N06.03 Hoogveen; Geologie van Nederland (TNO-GDN), hoogveen"

    - id: beekdal_veen
      match_exact: ["beekdal veen"]
      match: ["beekdal veen", "veenbeekdal"]
      titel: "Beekdal met veen"
      ontstaan: >-
        In de laagste delen van een beekdal bleef het jaarrond zo nat dat plantenresten
        niet konden verteren. Daar groeide veen in de dalbodem, gevoed door de beek en
        door kwel: grondwater dat op de hogere zandgronden is ingezijgd en hier weer
        aan de oppervlakte komt. Dat kwelwater is vaak kalkrijk en ijzerhoudend, wat
        deze plekken bijzonder maakt. Van oudsher waren dit natte hooilanden en
        elzenbroekbossen. Waar later ontwaterd is, is het veen ingeklonken en de
        dalbodem gezakt.
      versterken:
        - "Kies uitgesproken natte soorten: zwarte els, schietwilg, grauwe wilg, geoorde wilg, laurierwilg en gelderse roos."
        - "Plant langs de dalrand en houd de natte dalbodem zelf open als hooiland of moeras."
        - "Verlaag het waterpeil niet om te kunnen planten; dat laat het veen verteren en de bodem verder zakken."
        - "Voer maaisel af en bemest niet. Op kwelrijke veenbodems levert verschraling snel bijzondere planten op."
        - "Een elzensingel of een rij knotwilgen langs de dalrand is hier de meest passende vorm."
      bron: "BKNSN 2023 (code Dz6); natuurkennis.nl (OBN), Beekdallandschap"

    - id: beekdal_zand_leem
      match_exact: ["beekdal zand/leem", "beekdal zand-leem"]
      match: ["beekdal zand", "beekdal leem", "beekdal zand/leem"]
      titel: "Beekdal op zand en leem"
      ontstaan: >-
        Een beek heeft zich hier door het zandlandschap gesleten en een laag, vlak dal
        achtergelaten. Bij hoogwater trad de beek buiten haar oevers en zette fijn zand
        en leem af op de dalbodem. Vanaf de flanken komt bovendien kwelwater omhoog dat
        op de hogere zandgronden is ingezijgd. Daardoor is het dal veel vochtiger en
        voedselrijker dan de omringende zandgrond. Deze dalen waren te nat voor akkers
        en werden gebruikt als hooiland en weide, met elzen en wilgen langs de kanten.
        Veel beken zijn in de twintigste eeuw rechtgetrokken en verdiept.
      versterken:
        - "Kies soorten van vochtige, iets rijkere grond: zwarte els, schietwilg, boswilg, vogelkers, hazelaar en gelderse roos."
        - "Leg een elzensingel of struweelrand aan op de overgang van dal naar hogere grond; dat is hier de klassieke lijn."
        - "Houd de dalbodem open als grasland en plant niet strak tot aan de beek; een kruidenrijke oeverstrook is waardevol."
        - "Zorg dat de beek voldoende licht houdt; een volledig dichtgegroeide beek verliest veel waterleven."
        - "Voer maaisel af en bemest niet; verschraald beekdalgrasland wordt snel bloemrijk."
        - "Stem het planten af met het waterschap in verband met de onderhoudsstrook langs de beek."
      bron: "BKNSN 2023 (code Dz5); natuurkennis.nl (OBN), Beekdallandschap"

    - id: beekdal
      match_exact: ["beekdal"]
      match: ["beekdal"]
      titel: "Beekdal"
      ontstaan: >-
        Dit is de laagte waar een beek doorheen stroomt of ooit stroomde; in de
        Basiskaart hoort dit label bij het löss- en heuvellandschap van Zuid-Limburg.
        Het water heeft het dal in de loop van duizenden jaren uitgesleten en er bij
        hoogwater fijn materiaal in achtergelaten. Waar de ondergrond slecht doorlatend
        is, treedt grondwater aan de dalrand uit als bron of kwel, waardoor het dal
        vochtiger is dan de omgeving. Beekdalen waren daarom van oudsher hooiland en
        weide, met bomen en struiken langs de randen in plaats van midden in het dal.
      versterken:
        - "Kies soorten die tegen natte voeten kunnen: zwarte els, schietwilg, boswilg, vogelkers en gelderse roos."
        - "Beplant vooral de dalrand en houd de dalbodem open."
        - "Laat een onbeplante, kruidenrijke strook langs de beek liggen."
        - "Voer maaisel af en bemest niet; dat maakt het grasland in het dal bloemrijker."
        - "Overleg met het waterschap over de onderhoudsstrook voordat je langs de beek plant."
      bron: "BKNSN 2023 (code Lg5, löss- en heuvellandschap); natuurkennis.nl (OBN), Heuvellandschap en Beekdallandschap"

    - id: pingoruine
      match_exact: [":ingoruines en periglaciale laagten", "pingoruines en periglaciale laagten"]
      match: ["ingoruine", "pingoruine", "pingoruïne", "periglaciale laagt"]
      titel: "Pingoruïne of periglaciale laagte"
      ontstaan: >-
        In de ijstijd was de bodem permanent bevroren. Op sommige plekken perste
        grondwater zich door een scheur omhoog, bevroor en groeide aan tot een ijslens
        die de bovenliggende laag omhoog duwde: een pingo, een heuvel die tientallen
        meters hoog kon worden. Toen het ijs smolt, gleed de grond van de heuvel af en
        hoopte zich aan de voet op tot een ringvormige wal. Wat overbleef was een ronde
        kuil met een randwal eromheen, die zich vulde met water en later met veen. De
        meeste Nederlandse pingoruïnes dateren van ongeveer 13.000 tot 11.000 jaar
        geleden en liggen in Friesland, Groningen, Drenthe en Overijssel; ze zijn
        herkenbaar als opvallend ronde vennen en laagtes. Daarnaast liggen er andere
        laagtes die door vorst en smeltwater zijn gevormd.
      versterken:
        - "Laat de laagte zelf open. Een open ven of natte kuil is de kern van de waarde van deze plek."
        - "Plant hooguit op de randwal: zachte berk, zomereik, sporkehout en geoorde wilg passen daar."
        - "Draineer niet en voer geen water aan; deze laagtes zijn afhankelijk van regenwater en zijn van nature voedselarm."
        - "Houd bladinval beperkt door niet strak rondom te beplanten; veel blad in het water maakt het snel voedselrijk."
        - "Graaf de randwal niet af; die hoort bij de vorm en is duizenden jaren oud."
      bron: "BKNSN 2023 (code Kl3); Geologie van Nederland (TNO-GDN), pingoruïne; RCE, aardkundig erfgoed"

    - id: depressie_veen
      match_exact: ["depressie veen"]
      match: ["depressie veen", "veendepressie"]
      titel: "Laagte met veen"
      ontstaan: >-
        Dit is een laag gelegen kom in het zandlandschap waar water van nature blijft
        staan. Doordat de bodem er vrijwel altijd verzadigd is, verteerden plantenresten
        niet en groeide er veen. Zulke laagtes hebben geen afvoer naar een beek en
        worden gevoed door regenwater en soms door kwel. Van oudsher waren het vennen,
        moerasjes en natte broekbossen. Waar ze zijn ontwaterd, is het veen ingeklonken
        en de laagte nog dieper komen te liggen.
      versterken:
        - "Kies alleen soorten die permanent natte, zure grond verdragen: zwarte els, zachte berk, grauwe wilg, geoorde wilg en sporkehout."
        - "Laat de natste kern open. Een open, natte laagte is waardevol voor libellen, amfibieën en moerasvogels."
        - "Draineer niet. Juist het vasthouden van water maakt deze plek bijzonder en beperkt verdroging in de omgeving."
        - "Plant langs de rand van de laagte in plaats van erin, als geleidelijke overgang naar de hogere grond."
        - "Voer geen bagger, mest of grond aan; deze laagtes zijn van nature voedselarm."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: depressie_zand
      match_exact: ["depressie zand"]
      match: ["depressie zand", "zanddepressie"]
      titel: "Laagte in zand"
      ontstaan: >-
        Dit is een lager gelegen deel van het zandlandschap zonder duidelijke afvoer.
        Zulke laagtes zijn ontstaan doordat de wind in de ijstijd zand uitblies tot op
        de grondwaterspiegel, of doordat het zand er eenvoudig lager werd afgezet dan
        in de omgeving. Het grondwater staat er dicht onder het maaiveld en in de
        winter blijft er vaak water staan. Van oudsher lagen hier natte heide, vennen
        en broekbosjes; later zijn veel laagtes ontwaterd voor landbouw.
      versterken:
        - "Kies soorten die een natte winter aankunnen: zwarte els, zachte berk, boswilg, grauwe wilg en sporkehout."
        - "Gebruik het hoogteverschil: plant droogteminnende soorten op de rand en natte soorten in de laagte."
        - "Laat plekken waar water blijft staan open; die zijn waardevol voor amfibieën en insecten."
        - "Draineer niet extra om te kunnen planten, maar kies soorten die bij het natte karakter passen."
        - "Bemest niet; deze laagtes zijn van nature arm en dat levert de meeste bijzondere planten op."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: depressie
      match_exact: ["depressie"]
      match: ["depressie", "laagte"]
      titel: "Laagte"
      ontstaan: >-
        Dit is een lager gelegen kom waar water van nature naartoe stroomt en blijft
        staan; in de Basiskaart hoort dit label bij het hoogveenlandschap, zoals de
        Peel. Zulke laagtes hebben meestal geen afvoer naar een beek. Het grondwater
        staat er dicht onder het maaiveld, waardoor het er natter en vaak zuurder is dan
        in de omgeving. Van oudsher lagen hier vennen, moerasjes en natte bosjes.
      versterken:
        - "Kies soorten die natte grond verdragen: zwarte els, zachte berk, grauwe wilg, geoorde wilg en sporkehout."
        - "Laat de natste kern open en plant vooral langs de rand van de laagte."
        - "Houd water vast in plaats van het af te voeren; dat helpt ook tegen verdroging in de omgeving."
        - "Voer geen grond of mest aan; deze plekken zijn van nature voedselarm."
      bron: "BKNSN 2023 (code Hv3, hoogveenlandschap); natuurkennis.nl (OBN), voedselarme venen"

    - id: droogdal
      match_exact: ["droogdal", "droogdal met veen", "droogdal met keileem"]
      match: ["droogdal"]
      titel: "Droogdal"
      ontstaan: >-
        Een droogdal is een dal zonder beek. Het is gevormd in de ijstijden, toen de
        ondergrond permanent bevroren was en smeltwater niet kon wegzakken. Dat water
        stroomde over het oppervlak en sleet dalen uit. Toen de bodem later ontdooide,
        zakte het water gewoon de grond in en viel het dal droog. Alleen bij zeer zware
        buien stroomt er nu nog water doorheen. In de dalbodem ligt vaak wat fijner
        materiaal dan op de flanken; waar keileem of veen in de bodem zit, blijft water
        juist wél hangen en is de dalbodem nat.
      versterken:
        - "Plant dwars op het dal en niet in de lengterichting, zodat de beplanting afstromend water en grond opvangt."
        - "Kies op de droge flanken zomereik, ruwe berk, sleedoorn, eenstijlige meidoorn en hondsroos."
        - "Kies in een vochtige dalbodem, bijvoorbeeld boven keileem of veen, juist zwarte els, boswilg en sporkehout."
        - "Houd de dalbodem begroeid; kale grond spoelt bij hevige regen snel uit."
        - "Herstel bestaande steilrandjes of graften; die remmen erosie en horen bij het beeld van dit landschap."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: rivierterras_zand
      match_exact: ["rivierterras zand"]
      match: ["rivierterras zand", "terras zand"]
      titel: "Rivierterras van zand"
      ontstaan: >-
        Dit is een oude rivierbedding die nu hoog en droog boven het huidige dal ligt.
        In de koude perioden van de ijstijden vulden Maas en Rijn hun dal op met zand en
        grind; in de warmere perioden sneden ze zich er juist weer in. Wat aan de
        zijkant achterbleef, is een terras. Op dit terras bestaat de bovengrond vooral
        uit zand en grind: goed doorlatend, arm en droog. Water zakt er snel weg en in
        de zomer droogt de bovengrond diep uit.
      versterken:
        - "Kies soorten die droogte en arme grond aankunnen: zomereik, wintereik, ruwe berk, grove den, sleedoorn en hondsroos."
        - "Leg een houtwal of struweelhaag langs de terrasrand aan; dat maakt de trapvorm van het landschap zichtbaar."
        - "Plant klein plantmateriaal in het najaar en bedek de grond met strooisel of houtsnippers."
        - "Bemest niet. Droge, schrale terrassen zijn juist rijk aan warmteminnende insecten en planten."
        - "Houd open, zonnige plekken en zandige randen in stand; die horen bij dit droge landschap."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: rivierterras_klei
      match_exact: ["rivierterras klei"]
      match: ["rivierterras klei", "terras klei"]
      titel: "Rivierterras met klei"
      ontstaan: >-
        Ook dit is een oude rivierbedding die nu hoger in het landschap ligt, maar hier
        is de bovengrond bedekt met fijner materiaal: klei, leem of löss dat later is
        afgezet of aangewaaid. Daardoor houdt de grond veel meer water en
        voedingsstoffen vast dan een zandig terras. Zulke terrassen waren aantrekkelijk
        voor akkerbouw en zijn van oudsher in gebruik als bouwland. Onder de kleilaag
        zit vaak nog het oude zand en grind van de rivier.
      versterken:
        - "Kies soorten van rijkere, vochthoudende grond: haagbeuk, winterlinde, veldesdoorn, hazelaar, gele kornoelje en zoete kers."
        - "Plant op hellingen dwars op het verhang; klei en löss spoelen anders af."
        - "Leg een hoogstamboomgaard of een struweelhaag aan; op deze vruchtbare terrassen past dat goed."
        - "Houd de bodem bedekt en rijd niet met zware machines over natte grond; klei en leem verdichten snel."
        - "Voeg een kruidenrijke zoom toe langs de perceelrand voor insecten en akkervogels."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: rivierterras
      match_exact: ["rivierterras"]
      match: ["rivierterras", "terrasrest", "terras"]
      titel: "Rivierterras"
      ontstaan: >-
        Een rivierterras is een oude rivierbedding die nu hoog en droog in het landschap
        ligt; in de Basiskaart hoort dit label bij het löss- en heuvellandschap van
        Zuid-Limburg. Tijdens de ijstijden wisselden koude en warme perioden elkaar af:
        in koude tijden vulde de Maas haar dal op met zand en grind, in warme tijden
        sneed ze zich er weer in. Doordat het gebied bovendien langzaam omhoog kwam,
        bleef na elke insnijding een terras aan de zijkant liggen. Zo ontstond een trap
        van steeds oudere en hoger gelegen vlakken. De bovengrond is meestal grof, goed
        doorlatend en droog, soms met een laag leem of löss erover.
      versterken:
        - "Kies droogteverdragende soorten: zomereik, wintereik, ruwe berk, sleedoorn, eenstijlige meidoorn en hondsroos."
        - "Kies waar een leem- of losslaag ligt juist haagbeuk, veldesdoorn en hazelaar."
        - "Leg een houtwal of struweelhaag langs de terrasrand; dat maakt de trapvorm zichtbaar."
        - "Houd steilranden tussen twee terrassen begroeid; ze zijn erosiegevoelig en waardevol als warme, zonnige rand."
        - "Bemest niet op de grindige delen; de schraalheid is daar de landschapswaarde."
      bron: "BKNSN 2023 (code Lg7, löss- en heuvellandschap); natuurkennis.nl (OBN), Heuvellandschap"

    - id: laagveenvlakte
      match_exact: ["laagveenvlakte"]
      match: ["laagveenvlakte", "laagveen"]
      titel: "Laagveenvlakte"
      ontstaan: >-
        Hier stond het water zo hoog dat plantenresten niet konden verteren en zich
        eeuw na eeuw opstapelden tot veen. Anders dan hoogveen wordt laagveen gevoed
        door grondwater en door beek- of rivierwater, waardoor het minder arm en minder
        zuur is. Vanaf ongeveer de elfde eeuw groeven mensen sloten om het veen te
        ontwateren en er te boeren, waardoor het inklonk en de bodem daalde; die daling
        gaat nog altijd door. Op veel plaatsen is ook veen gebaggerd voor turf. Wat
        overbleef is een nat, open landschap met lange smalle kavels en veel water.
      versterken:
        - "Plant elzensingels langs de kavelsloten; dat is hier de klassieke lijn in het landschap."
        - "Kies natte soorten: zwarte els, schietwilg, grauwe wilg, geoorde wilg, gelderse roos en sporkehout."
        - "Zet knotwilgen langs de sloot; oude knotwilgen leveren nestholtes op voor vogels en vleermuizen."
        - "Plant in lijnen langs de kavelrichting en niet in blokken; de smalle strookverkaveling is hier het kenmerk."
        - "Verlaag het peil niet en houd afstand tot de slootkant; stem het onderhoudspad af met het waterschap."
        - "Maai oevers gefaseerd, zodat er altijd riet- en ruigtezomen blijven staan."
      bron: "BKNSN 2023 (codes Lv1 en Dz9); natuurkennis.nl (OBN), Laagveen- en zeekleilandschap; Geologie van Nederland (TNO-GDN), laagveen"

    - id: zeekleivlakte
      match_exact: ["zeekleivlakte"]
      match: ["zeekleivlakte", "zeeklei"]
      titel: "Zeekleivlakte"
      ontstaan: >-
        Dit vlakke land is opgebouwd uit slib dat de zee heeft aangevoerd. Bij elke
        vloed kwam water binnen dat fijn materiaal meebracht; dat bezonk en werd laag na
        laag klei. Zo groeide het gebied langzaam op tot boven de dagelijkse
        vloedlijn. Vanaf de middeleeuwen is het bedijkt en ingepolderd. De klei is
        kalkrijk en vruchtbaar, maar zwaar: hij houdt water lang vast, klinkt in en
        scheurt open in een droge zomer. Het landschap is open, met rechte kavels,
        brede sloten en weinig opgaand groen.
      versterken:
        - "Houd de openheid in stand: concentreer beplanting op en rond het erf, niet midden in het veld."
        - "Leg een dichte, gelaagde erfsingel aan aan de windzijde; dat is hier de gebruikelijke vorm."
        - "Kies soorten die zware klei en wind verdragen: schietwilg, fladderiep, gladde iep, eenstijlige meidoorn en vlier."
        - "Werk nooit op natte klei; verdichting herstelt zich hier jarenlang niet."
        - "Maak een kruidenrijke rand langs de sloot als verbinding tussen erf en polder."
        - "Plant iets verhoogd waar water blijft staan, zodat de wortelhals niet verdrinkt."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: strandvlakte
      match_exact: ["strandvlakte"]
      match: ["strandvlakte"]
      titel: "Strandvlakte"
      ontstaan: >-
        Een strandvlakte is de lage, natte strook die achter een strandwal lag. Terwijl
        de zee langs de kust zandruggen opbouwde, bleef daarachter een beschutte laagte
        over waar nauwelijks zand kwam. Daar bezonk fijn materiaal en groeide later
        veen. De strandvlaktes liggen daardoor als lange, natte stroken tussen de
        drogere strandwallen in. Van oudsher lagen hier weiland en moerasbos, terwijl de
        bewoning op de wallen zat.
      versterken:
        - "Kies natte soorten: zwarte els, schietwilg, grauwe wilg, gelderse roos en sporkehout."
        - "Plant in de lengterichting van de vlakte; het evenwijdige patroon van wallen en vlaktes is hier het kenmerk."
        - "Houd de laagte zelf open als grasland en plant vooral op de overgang naar de hogere strandwal."
        - "Draineer niet extra; het natte karakter hoort bij deze strook."
        - "Leg een elzensingel of een rij knotwilgen langs de kavelsloot aan."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: strandwal
      match_exact: ["strandwal"]
      match: ["strandwal", "oude duinen"]
      titel: "Strandwal"
      ontstaan: >-
        Na de laatste ijstijd steeg de zeespiegel eerst snel. Toen die stijging ongeveer
        vijfduizend jaar geleden sterk afzwakte, bouwde de zee langs de kust zandruggen
        op. Doordat de kustlijn zich stap voor stap zeewaarts verplaatste, ontstond tot
        ongeveer het begin van onze jaartelling een reeks evenwijdige wallen met
        daartussen lagere vlaktes. De strandwallen lagen hoog en droog en waren daarmee
        de aantrekkelijkste plek in het natte kustgebied: de oudste dorpen, wegen en
        later de landgoederen liggen erop. De kalk is uit de bovengrond grotendeels
        weggespoeld, waardoor de grond hier zuurder en armer is dan in de jonge duinen.
      versterken:
        - "Kies soorten van droge, zure zandgrond: zomereik, ruwe berk, hazelaar, lijsterbes en hulst."
        - "Plant in de lengterichting van de wal; dat versterkt het evenwijdige patroon van het kustlandschap."
        - "Leg langs de oude wegen op de wal een bomenrij of laan aan; dat past bij de bewoningsgeschiedenis."
        - "Maak de overgang naar de lagere strandvlakte geleidelijk met een struweelrand."
        - "Bemest niet; de schraalheid van de oude duingrond hoort erbij."
      bron: "BKNSN 2023 (code Bd1); Geologie van Nederland (TNO-GDN), strandwal en kustduin"

    - id: grondmorene_plateau
      match_exact: ["grondmorene plateau, -vlakte"]
      match: ["grondmorene plateau", "grondmorenevlakte", "grondmorene vlakte", "keileemplateau", "keileemvlakte"]
      titel: "Grondmoreneplateau of -vlakte"
      ontstaan: >-
        Onder het landijs dat Nederland tijdens het Saalien, ongeveer 150.000 jaar
        geleden, bereikte, werd het meegevoerde materiaal fijngemalen en samengeperst
        tot keileem: een stugge, meestal kalkloze mengeling van klei, leem, zand, grind
        en zwerfkeien. Waar het ijs over de ondergrond schoof zonder hem op te stuwen,
        bleef die keileem als een vlakke deken achter; het Drents Plateau is er het
        grootste voorbeeld van. Keileem laat water heel slecht door, waardoor regenwater
        erop blijft staan in plaats van weg te zakken. Zulke plateaus en vlaktes zijn
        daarom vaak nat in de winter en juist droog in de zomer, omdat de wortels niet
        bij het diepere grondwater kunnen.
      versterken:
        - "Kies soorten die zowel natte winters als droge zomers verdragen: zomereik, zachte berk, ruwe berk, lijsterbes en sporkehout."
        - "Plant niet in een kuil; op keileem blijft water in het plantgat staan en verdrinken de wortels."
        - "Houd rekening met een dunne doorwortelbare laag; bomen blijven hier lager en zijn gevoeliger voor storm."
        - "Laat plekken waar in de winter water blijft staan open; ze zijn waardevol voor amfibieën."
        - "Werk niet op natte grond; keileem verdicht extreem snel en herstelt nauwelijks."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: grondmorenerug
      match_exact: ["grondmorenerug"]
      match: ["grondmorenerug", "grondmorene rug", "keileemrug"]
      titel: "Grondmorenerug"
      ontstaan: >-
        Ook deze rug is een spoor van het landijs. Onder het ijs werd meegesleept
        materiaal fijngemalen tot keileem, dat aan de randen van het keileemplateau tot
        langgerekte ruggen werd opgestuwd. Die ruggen liggen noordnoordoost-zuidzuidwest
        en verraden daarmee dat het ijs uit het noorden kwam. De rug ligt hoger en droger
        dan de omringende vlakte, maar in de ondergrond zit nog steeds de stugge, slecht
        doorlatende keileem. Op zulke ruggen liggen van oudsher de bewoning, de akkers en
        de doorgaande wegen.
      versterken:
        - "Kies soorten voor een droge bovengrond boven een natte, stugge ondergrond: zomereik, ruwe berk, lijsterbes en hazelaar."
        - "Leg een houtwal langs de rug aan; die volgt de vorm van het landschap en maakt hem zichtbaar."
        - "Plant niet in een kuil en werk het plantgat niet glad; op keileem vormt een gladde wand een waterdichte bak."
        - "Zet een solitaire eik of een boomgroep op het hoogste punt als markering."
        - "Houd er rekening mee dat wortels de keileem niet in gaan; kies geen soorten die diep moeten wortelen."
      bron: "BKNSN 2023 (code Kl1); RCE, aardkundig erfgoed - keileemruggen van Zuidwolde; Geologie van Nederland (TNO-GDN), grondmorene"

    - id: dekzandrug
      match_exact: ["dekzandrug"]
      match: ["dekzandrug", "zandrug"]
      titel: "Dekzandrug"
      ontstaan: >-
        In de laatste ijstijd lag de grond hier kaal en bevroren en had de wind vrij
        spel. Het zand werd opgenomen en verderop weer neergelegd in langgerekte, lage
        ruggen. Ze zijn vaak maar één tot enkele meters hoog, maar in het vlakke
        zandlandschap is dat genoeg om droog te liggen. Juist daarom lagen de eerste
        akkers, boerderijen en wegen op deze ruggen. Het zand is arm en doorlatend,
        dus regenwater zakt snel weg en de bovengrond droogt in de zomer diep uit.
      versterken:
        - "Leg een houtwal of houtsingel aan langs de rug; die volgt de vorm van het landschap en maakt hem zichtbaar."
        - "Kies droogteverdragende soorten: zomereik, wintereik, ruwe berk, lijsterbes, hazelaar en sleedoorn."
        - "Zet een solitaire eik of een kleine eikengroep op het hoogste punt; dat is hier een oud en herkenbaar beeld."
        - "Maak een brede kruidenrijke zoom aan de zonzijde en maai die één keer per jaar met afvoer van het maaisel."
        - "Bemest niet en voer geen grond aan; de schraalheid is hier de landschapswaarde."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: dekzandvlakte
      match_exact: ["dekzandvlakte"]
      match: ["dekzandvlakte", "dekzandlaagte", "dekzand"]
      titel: "Dekzandvlakte"
      ontstaan: >-
        Tussen de dekzandruggen liggen vlakke, lagere delen. Ook daar heeft de wind in
        de ijstijd zand neergelegd, maar zonder dat er duidelijke ruggen ontstonden.
        Doordat deze delen lager liggen, staat het grondwater er dichter onder het
        maaiveld dan op de ruggen. Van oudsher waren dit natte heidevelden en
        broekbossen; na ontwatering zijn het weilanden en akkers geworden. In de
        laagtes kan in de winter lang water blijven staan.
      versterken:
        - "Kies soorten die een natte winter aankunnen: zwarte els, zachte berk, boswilg, sporkehout en gelderse roos."
        - "Gebruik de kleine hoogteverschillen: droogteminnende soorten op de flanken, natte soorten in de laagte."
        - "Leg een singel of struweelrand langs de perceelrand aan; in het vlakke land geeft dat meteen structuur."
        - "Draineer niet extra om te kunnen planten, maar kies soorten die bij het natte karakter passen."
        - "Laat laagtes waar water blijft staan met rust; die zijn waardevol voor amfibieën en insecten."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: stuifzandduin
      match_exact: ["stuifzandduin (en bijbehorende vlaktes)"]
      match: ["stuifzandduin", "stuifzand", "landduin"]
      titel: "Stuifzandduin en bijbehorende vlaktes"
      ontstaan: >-
        Deze duinen liggen ver van zee en zijn mede door mensen ontstaan. Toen de heide
        vanaf de middeleeuwen zwaar werd begraasd en er plaggen werden gestoken, raakte
        de bodem plaatselijk kaal. Op het onbeschermde zand kreeg de wind opnieuw grip
        en ging het stuiven; zo ontstonden landduinen met uitgestoven vlaktes ertussen.
        In de negentiende en twintigste eeuw is het meeste stuifzand vastgelegd met
        grove den. Wat overbleef is een extreem droge en arme bodem met vaak nog maar
        een dun laagje humus.
      versterken:
        - "Kies alleen soorten die extreme droogte en armoede aankunnen: grove den, ruwe berk, zomereik, jeneverbes en struikhei."
        - "Houd beplanting laag en dicht bij het erf; open stuifzand en schrale vegetatie zijn hier zelf de natuurwaarde."
        - "Plant klein plantmateriaal in het najaar en reken op enige uitval."
        - "Voeg geen grond, compost of mest toe; verrijking is hier de grootste bedreiging."
        - "Laat open zandplekken open; ze zijn belangrijk voor warmteminnende insecten en reptielen."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: restgeul
      match_exact: ["restgeul"]
      match: ["restgeul", "strang", "oude geul", "hank"]
      titel: "Restgeul"
      ontstaan: >-
        Een restgeul is een oude rivier- of beekbedding die is achtergebleven toen het
        water een andere weg koos. De geul raakte langzaam opgevuld met fijn slib en
        plantenresten en ligt nu als een langgerekte, kronkelende laagte in het land.
        Vaak staat er nog water in, of is de laagte alleen in de winter nat. Doordat de
        bodem er venig en fijn is, houdt hij veel water vast. Zulke geulen zijn goed
        herkenbaar aan hun bochtige vorm, ook als ze allang zijn dichtgegroeid.
      versterken:
        - "Kies natte soorten: zwarte els, schietwilg, grauwe wilg, laurierwilg, gelderse roos en sporkehout."
        - "Volg met de beplanting de bochtige vorm van de geul; dat maakt de oude loop weer zichtbaar."
        - "Houd open water en natte laagtes open; ze zijn belangrijk voor vissen, amfibieën en libellen."
        - "Plant op de flauwe oever en niet in de geul zelf; een deel van de oever kruidenrijk laten is waardevol."
        - "Draineer niet; het vasthouden van water is hier juist de kwaliteit."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: veenrest
      match_exact: ["veenrest"]
      match: ["veenrest", "restveen"]
      titel: "Veenrest"
      ontstaan: >-
        Dit is een stuk veen dat is blijven liggen waar het omringende veen is
        afgegraven of verdwenen. Het veen zelf is ooit gegroeid doordat plantenresten
        in een nat, zuurstofarm milieu niet verteerden en zich opstapelden. Doordat de
        omgeving is ontwaterd of afgegraven, ligt de rest nu vaak juist iets hoger dan
        het land eromheen, of ligt hij als een dunne laag op zand of klei. Het
        resterende veen droogt makkelijk uit en verteert dan alsnog.
      versterken:
        - "Kies soorten die natte, zure grond verdragen: zwarte els, zachte berk, grauwe wilg, geoorde wilg en sporkehout."
        - "Houd het waterpeil zo hoog mogelijk; zodra veen droogvalt, verteert het en zakt de bodem."
        - "Plant ondiep en niet te dicht bij gebouwen; bomen wortelen in veen ondiep en waaien eerder scheef."
        - "Rijd niet met zware machines over de veenrest; die is licht en drukt makkelijk in."
        - "Voer geen grond of mest aan; veen is van nature arm en dat hoort bij de plek."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: kreekrug
      match_exact: ["kreekrug"]
      match: ["kreekrug"]
      titel: "Kreekrug"
      ontstaan: >-
        Een kreekrug is een oude getijdengeul die nu juist hoger ligt dan het land
        eromheen. Dat klinkt tegenstrijdig, maar het komt doordat de geul zich met
        zand vulde terwijl er naast de geul fijne klei bezonk. Klei klinkt na
        ontwatering veel sterker in dan zand, en zo kwam de oude geulvulling
        langzaam als een rug in het landschap te liggen. Kreekruggen zijn daardoor de
        hoogste, droogste en lichtste gronden van het zeekleigebied, en ze slingeren
        als lichte banen door de polder. Van oudsher liggen de boerderijen, dorpen en
        wegen erop.
      versterken:
        - "Volg met de beplanting de kronkelende lijn van de rug; dat maakt het oude krekenpatroon zichtbaar."
        - "Kies soorten voor lichtere, goed doorlatende klei of zavel: eenstijlige meidoorn, zoete kers, veldesdoorn, hazelaar en vlier."
        - "Leg een hoogstamboomgaard of een erfsingel aan op de rug; dat is hier de klassieke plek voor beplanting."
        - "Houd het lagere land ernaast open; het contrast tussen rug en kom is het kenmerk van dit landschap."
        - "Graaf de rug niet af; het hoogteverschil is klein maar landschappelijk en cultuurhistorisch waardevol."
      bron: "BKNSN 2023 (codes Zk3 en Dr2); Geologie van Nederland (TNO-GDN), kwelder en kreekrug"

    - id: kreekbedding
      match_exact: ["kreekbedding"]
      match: ["kreekbedding", "kreek", "geulbedding"]
      titel: "Kreekbedding"
      ontstaan: >-
        Dit is de bedding van een oude getijdenkreek: de geul waardoor het zeewater bij
        elk tij het gebied in en uit stroomde. Doordat het water er met kracht doorheen
        ging, bleef de bedding open en werd hij dieper uitgesleten dan de omgeving.
        Na de bedijking viel de kreek droog of bleef hij als watergang in gebruik. De
        bodem bestaat vaak uit zandig materiaal. Waar de omringende klei na ontwatering
        sterk is ingeklonken, is zo'n zandige geulvulling juist hoger komen te liggen;
        die noemen we een kreekrug. Waar dat niet is gebeurd, ligt de bedding nog als een
        kronkelende laagte of watergang in de polder.
      versterken:
        - "Volg met beplanting de kronkelende loop van de kreek; die lijn is het geheugen van het landschap."
        - "Kies soorten die natte, kalkrijke grond verdragen: schietwilg, zwarte els, eenstijlige meidoorn, vlier en gelderse roos."
        - "Houd open water en natte laagtes in de bedding open; ze zijn waardevol voor vogels en waterleven."
        - "Zet knotwilgen langs de kreek; dat is een passende en onderhoudsvriendelijke vorm."
        - "Houd rekening met zout of brak kwelwater; kies bij twijfel zoutverdragende soorten."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: meerbodem
      match_exact: ["meerbodem"]
      match: ["meerbodem", "droogmakerij", "drooggemaakt", "meerbodems"]
      titel: "Meerbodem in een droogmakerij"
      ontstaan: >-
        Dit was ooit de bodem van een meer. Veel van die meren zijn ontstaan doordat
        veen was weggegraven of door golfslag werd weggeslagen, waarna het water zich
        steeds verder uitbreidde. Vanaf de zeventiende eeuw zijn zulke meren met molens
        en later met gemalen drooggemalen. Wat tevoorschijn kwam was de oude meerbodem:
        vlakke, vaak zware klei die meters lager ligt dan het omringende land.
        Droogmakerijen zijn herkenbaar aan hun ringdijk, hun ringvaart en hun strakke,
        rechthoekige verkaveling. Het grondwater staat er hoog en er kan zout kwelwater
        omhoog komen.
      versterken:
        - "Volg met beplanting het rechthoekige patroon van wegen en tochten; die strakke maat is hier het kenmerk."
        - "Leg een erfsingel of een laanbeplanting aan; losse groepen midden in de polder passen niet bij het beeld."
        - "Kies soorten voor natte, zware klei: schietwilg, zwarte els, eenstijlige meidoorn, vlier en fladderiep."
        - "Houd rekening met brak of zout kwelwater; kies bij twijfel zoutverdragende soorten en plant iets verhoogd."
        - "Werk nooit op natte klei; verdichting van meerbodemklei herstelt zich nauwelijks."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: petgaten
      match_exact: ["petgaten"]
      match: ["petgaten", "petgat", "trekgat", "legakker"]
      titel: "Petgaten"
      ontstaan: >-
        Petgaten zijn de sporen van turfwinning in het laagveen. Turfstekers groeven
        lange, smalle stroken veen uit tot onder de waterlijn en legden het natte veen
        te drogen op smalle stroken land ertussen: de legakkers. Zo ontstond het
        kenmerkende patroon van afwisselend water en smalle ribben. Waar de legakkers
        te smal werden, sloegen ze bij storm weg en groeiden de petgaten uit tot
        plassen. In de petgaten die bleven, groeit het veen langzaam weer dicht, van
        open water via rietland naar moerasbos.
      versterken:
        - "Houd het patroon van water en legakkers herkenbaar; dat is de cultuurhistorische kern van dit landschap."
        - "Plant hooguit op de legakkers, en dan spaarzaam: zwarte els, grauwe wilg, geoorde wilg en sporkehout."
        - "Laat een deel van de petgaten open water en rietland; bebossing van alles maakt het gebied juist armer."
        - "Zet knotwilgen op de legakker in plaats van doorgroeiende bomen; die blijven lichter en waaien minder snel om."
        - "Rijd of loop niet met zware belasting over de legakkers; ze zijn smal en drijvend van karakter."
      bron: "BKNSN 2023 (code Lv2); natuurkennis.nl (OBN), Laagveen- en zeekleilandschap"

    - id: stroomrug_oeverwal
      match_exact: ["stroomrug, oeverwal"]
      match: ["stroomrug", "oeverwal"]
      titel: "Stroomrug of oeverwal"
      ontstaan: >-
        Als een rivier bij hoogwater buiten haar oevers trad, verloor het water direct
        naast de bedding snelheid. Het grovere materiaal, zand en zavel, bleef daardoor
        vlak langs de rivier liggen en bouwde er een langgerekte rug op. Zo'n oeverwal
        ligt hoger en droger dan het land erachter en is lichter en beter bewerkbaar.
        Dat maakte hem tot de aantrekkelijkste plek van het rivierengebied: dorpen,
        boerderijen, akkers en boomgaarden liggen er van oudsher op. Waar de rivier
        later verlegd is, ligt de oude stroomrug nog altijd als een flauwe verhoging in
        het land.
      versterken:
        - "Plant een meidoornhaag of struweelhaag als erfgrens; dat is hier de klassieke perceelscheiding."
        - "Leg een hoogstamboomgaard aan met appel, peer, pruim en kers; op de oeverwal is dat van oudsher de plek."
        - "Kies soorten van rijke, goed doorlatende grond: zoete kers, walnoot, veldesdoorn, hazelaar en kardinaalsmuts."
        - "Zet een bomenrij of laan langs de weg of de oprit; die versterkt de lijn van de stroomrug."
        - "Houd het hoogteverschil met de lagere kom zichtbaar en kies daar juist wilg en els."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: rivierkom
      match_exact: ["rivierkom"]
      match: ["rivierkom", "komvlakte", "komklei", "komgrond"]
      titel: "Rivierkom"
      ontstaan: >-
        Ver van de rivierbedding kwam bij hoogwater alleen nog traag stromend water dat
        vrijwel geen zand meer meevoerde. Wat daar bezonk was de allerfijnste klei. Zo
        ontstonden de kommen: lage, vlakke gebieden met zware klei die water slecht
        doorlaat. In de winter staat het water er lang op het land en in de zomer
        scheurt de grond open. Kommen waren te nat voor akkers en bleven eeuwenlang
        grasland, moeras en broekbos, met wilgengrienden en elzen op de natste plekken.
      versterken:
        - "Kies soorten die zware, natte klei verdragen: zwarte els, schietwilg, gelderse roos, sporkehout en eenstijlige meidoorn."
        - "Zet knotwilgen langs sloten en kavelgrenzen; die horen bij dit natte deel van het rivierenland."
        - "Plant iets verhoogd waar water blijft staan, zodat de wortelhals niet verdrinkt."
        - "Werk nooit op natte klei; verdichte komklei herstelt zich jarenlang niet."
        - "Houd de openheid van de kom in stand: plant in lijnen langs de kavelgrenzen en niet in blokken."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: uiterwaard
      match_exact: ["uiterwaard"]
      match: ["uiterwaard", "buitendijks", "kronkelwaard"]
      titel: "Uiterwaard"
      ontstaan: >-
        De uiterwaard is het land tussen de rivier en de dijk. Sinds de bedijking is dit
        het enige deel van het rivierengebied dat nog regelmatig overstroomt. Bij elk
        hoogwater komt er water overheen dat zand en klei achterlaat, waardoor het
        landschap blijft veranderen: er ontstaan zandige ruggen, kleiige laagten en
        oude geulen. Droge en natte plekken liggen hier daardoor vlak naast elkaar.
        Uiterwaarden werden gebruikt als hooiland, wilgengriend en voor de kleiwinning
        van steenfabrieken.
      versterken:
        - "Overleg altijd eerst met de rivierbeheerder; Rijkswaterstaat legt in de vegetatielegger vast welke begroeiing in de uiterwaard is toegestaan, omdat beplanting de waterafvoer remt."
        - "Kies soorten die overstroming verdragen: schietwilg, zwarte els, zwarte populier en gelderse roos."
        - "Griend en knotwilgen zijn hier de meest passende vormen; ze blijven laag en houden water minder tegen dan opgaand bos."
        - "Plant in de stroomrichting van de rivier en niet dwars erop."
        - "Laat oude geulen, strangen en laagtes open; ze zijn belangrijk voor vissen, amfibieën en vogels."
      bron: "BKNSN 2023 (code Rg3); Rijkswaterstaat, vegetatielegger en beheer van uiterwaarden"

    - id: overslaggronden
      match_exact: ["overslaggronden"]
      match: ["overslaggrond", "overslag", "dijkdoorbraak", "wiel", "kolk"]
      titel: "Overslaggronden"
      ontstaan: >-
        Overslaggronden zijn het gevolg van een dijkdoorbraak. Als een dijk bezweek,
        schoot het water met grote kracht naar binnen. Het sloeg een diep gat in de
        grond, een wiel of kolk, en spoelde het uitgeslagen materiaal als een waaier
        over het achterliggende land. Die waaier bestaat uit klei vermengd met grof zand
        en soms grind uit de diepere ondergrond, en is tot ongeveer anderhalve meter
        dik. Hij ligt nu als een lichtere, hoger gelegen en beter doorlatende plek in de
        zwaardere klei en is van oudsher gewilde grond voor fruitteelt. De wielen zelf
        zijn vaak blijven bestaan als diepe, ronde plassen; de herstelde dijk loopt er
        meestal in een bocht omheen.
      versterken:
        - "Kies soorten voor lichtere, goed doorlatende grond, ook al ligt de plek midden in het kleigebied: zomereik, ruwe berk, sleedoorn en eenstijlige meidoorn."
        - "Een hoogstamboomgaard past hier goed; overslaggronden zijn van oudsher gewilde fruitgrond."
        - "Laat het wiel of de kolk open water blijven; die plassen zijn diep, oud en waardevol."
        - "Plant rond het wiel een struweelrand in plaats van een gesloten bosje, zodat het water licht houdt."
        - "Graaf de waaier niet af; het is een leesbaar spoor van de waterstaatsgeschiedenis."
      bron: "BKNSN 2023 (code Rg4); RCE, Dijkdoorbraakgaten (beheermodel); Geologie van Nederland (TNO-GDN), doorbraakgaten"

    - id: rivierduin
      match_exact: ["rivierduin"]
      match: ["rivierduin", "donk"]
      titel: "Rivierduin of donk"
      ontstaan: >-
        Aan het einde van de laatste ijstijd stonden de rivieren in de zomer vol
        smeltwater en vielen ze in de winter grotendeels droog. Uit de kale, droge
        rivierbeddingen blies de wind zand op tot langgerekte duinen langs de oevers.
        Toen het klimaat opwarmde, groeide er veen en klei omheen, maar de zandkoppen
        bleven als hoge, droge plekken boven het natte land uitsteken. Zulke koppen
        heten donken; het grootste deel van het duin ligt daaronder nog begraven onder
        veen en klei. Ze waren eeuwenlang de enige droge plek in de wijde omgeving en
        werden daarom al in de steentijd bewoond; vaak staat er nu nog een dorp of
        boerderij op.
      versterken:
        - "Kies droogteverdragende soorten van zandgrond: zomereik, ruwe berk, hazelaar, sleedoorn en lijsterbes."
        - "Zet een solitaire eik of een kleine boomgroep op de kop; dat maakt de hoogte in het vlakke land zichtbaar."
        - "Maak de overgang van de droge kop naar het natte omringende land geleidelijk met een struweelrand."
        - "Kies aan de voet van de kop juist natte soorten: zwarte els, schietwilg en gelderse roos."
        - "Graaf niet af en hoog niet op; het hoogteverschil is hier de landschappelijke en archeologische waarde."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: kustduinen
      match_exact: ["kustduinen"]
      match: ["kustduin", "jonge duinen", "duinvallei", "zeeduin"]
      titel: "Kustduinen"
      ontstaan: >-
        De zee bracht eeuwenlang zand naar het strand en de wind blies dat landinwaarts.
        Zo groeiden hoge jonge duinen, die vooral tussen ongeveer 1200 en 1600 over de
        oudere strandwallen heen schoven. Ten zuiden van Bergen in Noord-Holland bevat
        het zand veel kalk uit vergruisde schelpen; op de Waddeneilanden en ten noorden
        van Bergen is het duinzand van nature kalkarm. Bovendien spoelt kalk geleidelijk
        uit de bovengrond weg. In de laagtes tussen de duinen, de duinvalleien, komt het
        grondwater dicht aan de oppervlakte; daar is het vochtig en soms kalkrijk. Wind,
        zout en droogte bepalen hier wat er kan groeien.
      versterken:
        - "Kies zout- en windverdragende struiken: duindoorn, wilde liguster, eenstijlige meidoorn, kruipwilg, duinroos en vlier."
        - "Houd de beplanting laag en gesloten; hoge losse bomen overleven de zeewind zelden."
        - "Plant aan de landzijde van het erf en laat de zeezijde laag of open."
        - "Vermijd woekeraars die in de duinen problemen geven, zoals rimpelroos en Amerikaanse vogelkers."
        - "Laat vochtige duinvalleien open; daar horen lage, kruidenrijke begroeiing en geen bomen."
        - "Bemest niet en geef geen water; schraalte en droogte horen bij dit landschap."
      bron: "BKNSN 2023 (code Bd3); Geologie van Nederland (TNO-GDN), kustduin; natuurkennis.nl (OBN), Duin- en kustlandschap"

    - id: stuwwal
      match_exact: ["stuwwal"]
      match: ["stuwwal", "gestuwd"]
      titel: "Stuwwal"
      ontstaan: >-
        Tijdens de voorlaatste ijstijd, het Saalien, schoof ongeveer 150.000 jaar geleden
        landijs vanuit het noorden Nederland binnen, tot ongeveer de lijn
        Haarlem-Utrecht-Nijmegen. De ijstongen duwden de bodem voor zich uit en omhoog,
        zoals een schaaf een krul opschuift. De opgestuwde lagen zand, grind en klei
        vormen de heuvels die we stuwwallen noemen; de hoogste komen tot ruim honderd
        meter boven zeeniveau. Doordat ze hoog liggen, zakt regenwater diep weg en is de
        bovengrond droog en arm. In de schuin opgestuwde lagen zit soms leem, waardoor
        water plaatselijk juist blijft hangen en er natte plekken op de helling zitten.
      versterken:
        - "Kies soorten die droogte en armoede verdragen: zomereik, wintereik, ruwe berk, grove den, lijsterbes en hazelaar."
        - "Plant op hellingen dwars op het verhang; dat houdt regenwater en bodem beter vast."
        - "Maak de overgang van bos naar open terrein geleidelijk met een struikenmantel en een kruidenzoom."
        - "Kies op natte plekken boven een leemlaag juist zachte berk en sporkehout."
        - "Laat oude, dikke bomen en dood hout staan; dat zijn op de stuwwal de rijkste plekken voor paddenstoelen, insecten en vogels."
      bron: "BKNSN 2023 (code Sw1); Geologie van Nederland (TNO-GDN), stuwwal"

    - id: smeltwaterafzetting
      match_exact: ["smeltwaterafzettingen, sandr"]
      match: ["smeltwaterafzetting", "sandr", "smeltwater", "spoelzand"]
      titel: "Smeltwaterafzetting of sandr"
      ontstaan: >-
        Aan de voet van de stuwwallen kwam bij het afsmelten van het landijs enorm veel
        water vrij. Dat smeltwater voerde zand en grind mee en spreidde het uit in
        brede, flauw hellende waaiers, ook wel sandr genoemd. Hoe verder van de stuwwal,
        hoe fijner het materiaal dat bleef liggen. Het resultaat is een licht hellend
        vlak van grof, goed doorlatend zand waarin water snel wegzakt. De bovengrond is
        daardoor droog en arm.
      versterken:
        - "Kies droogteverdragende soorten: zomereik, ruwe berk, grove den, lijsterbes en sleedoorn."
        - "Kies in de laagste delen van de waaier ook soorten die meer vocht willen, zoals zwarte els en sporkehout."
        - "Leg lange houtwallen of singels aan in de richting van het flauwe verhang, zodat het reliëf zichtbaar blijft."
        - "Houd de bodem bedekt met strooisel; op grof zand verdwijnt vocht anders erg snel."
        - "Bemest niet; deze grond is van nature schraal en dat hoort erbij."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: daluitspoelingswaaier
      match_exact: ["daluitspoelingswaaier"]
      match: ["daluitspoeling", "puinwaaier"]
      titel: "Daluitspoelingswaaier"
      ontstaan: >-
        Waar een smeltwaterdal uit de stuwwal het lagere land bereikte, verloor het
        water plotseling snelheid. Al het meegevoerde zand en grind viel daar uit en
        bouwde een waaiervormige helling op aan de uitgang van het dal. Zo'n waaier is
        het hoogst en grofst bij de daluitgang en wordt naar buiten toe steeds vlakker
        en fijner. De grond is grofkorrelig en goed doorlatend, dus water zakt er snel
        weg. Bovenin is het daardoor droog, terwijl het aan de rand van de waaier
        vochtiger kan zijn.
      versterken:
        - "Kies bovenin de waaier droogteverdragende soorten: zomereik, ruwe berk, grove den en sleedoorn."
        - "Kies aan de vochtiger voet van de waaier zwarte els, boswilg, hazelaar en sporkehout."
        - "Plant dwars op het verhang, zodat de beplanting afstromend water opvangt."
        - "Maak de vorm van de waaier zichtbaar met een houtwal of struweelrand langs de rand."
        - "Bemest niet; de schraalheid van deze zandige waaiers hoort bij het landschap."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: lossplateau
      match_exact: ["lossplateau"]
      match: ["lossplateau", "lössplateau", "plateau"]
      titel: "Lössplateau"
      ontstaan: >-
        Dit is het hoge, vlakke deel van het Zuid-Limburgse heuvelland. De ondergrond
        bestaat uit kalksteen uit het Krijt en oude rivierafzettingen van de Maas; daar
        bovenop ligt een laag löss, fijn stof dat tijdens de ijstijden over het kale land
        is aangewaaid en die plaatselijk tot wel vijftien meter dik is. Op het vlakke
        plateau is die lösslaag het dikst en het minst verstoord, want er spoelt weinig
        weg. De grond is vruchtbaar en goed bewerkbaar en is daarom van oudsher in
        gebruik als akkerland. Het plateau is open, met dorpen en hoogstamboomgaarden
        aan de randen.
      versterken:
        - "Houd het open akkerbeeld van het plateau in stand en concentreer beplanting bij het erf en langs wegen."
        - "Leg een bomenrij of laan langs de weg aan; dat past bij het open plateau met zijn lange zichtlijnen."
        - "Leg een hoogstamboomgaard aan aan de dorpsrand, met appel, peer, pruim en kers."
        - "Kies soorten van rijke lössgrond: haagbeuk, winterlinde, veldesdoorn, hazelaar en gele kornoelje."
        - "Leg brede kruidenrijke akkerranden aan; op het open plateau leveren die veel op voor akkervogels en insecten."
      bron: "BKNSN 2023 (code Lg1); natuurkennis.nl (OBN), Heuvellandschap; Geologie van Nederland (TNO-GDN), löss"

    - id: losshelling
      match_exact: ["losshelling"]
      match: ["losshelling", "lösshelling", "lössglooiing", "lossglooiing"]
      titel: "Lösshelling"
      ontstaan: >-
        Dit is de glooiende overgang van het hoge plateau naar het lager gelegen dal.
        De helling is bedekt met löss, dat tijdens de ijstijden als fijn stof is
        aangewaaid en later gedeeltelijk van hogerop naar beneden is gespoeld. Löss is
        vruchtbaar maar bijzonder erosiegevoelig: bij een felle bui slaat het oppervlak
        dicht en stroomt de grond als modder de helling af. Op zulke hellingen liggen
        graften: begroeide steilrandjes evenwijdig aan de hoogtelijnen, waarschijnlijk
        aangelegd om erosie tegen te gaan. Holle wegen ontstonden doordat karren en vee
        zich in de zachte grond insneden.
      versterken:
        - "Plant altijd evenwijdig aan de hoogtelijnen; beplanting die het verhang volgt versnelt erosie juist."
        - "Herstel of leg een graft aan: een strook struiken en bomen evenwijdig aan de hoogtelijnen die afspoelende grond opvangt."
        - "Kies soorten van rijke lössgrond: haagbeuk, veldesdoorn, hazelaar, gele kornoelje, wollige sneeuwbal en eenstijlige meidoorn."
        - "Houd de bodem bedekt; kale löss is de belangrijkste oorzaak van modderstromen in deze streek."
        - "Laat de begroeiing op holle wegen en steilranden staan; die houdt de wanden bij elkaar."
      bron: "BKNSN 2023 (code Lg2); natuurkennis.nl (OBN), Heuvellandschap"

    - id: kalkhelling
      match_exact: ["kalkhelling"]
      match: ["kalkhelling", "kalkgrasland", "krijthelling", "mergelhelling"]
      titel: "Kalkhelling"
      ontstaan: >-
        Op deze helling ligt de kalksteen dicht onder het oppervlak of aan de dag. Die
        kalk is in het Krijt, tientallen miljoenen jaren geleden, gevormd in een warme,
        ondiepe zee uit de resten van schelpdieren en andere zeeorganismen. Doordat de
        Maas zich diep insneed en de lösslaag van de steile hellingen afspoelde, kwam het
        kalkgesteente hier weer aan de oppervlakte. De bodem is ondiep, kalkrijk, warm en
        snel droog, met een hoge zuurgraad rond pH 7 tot 8. De open kalkgraslanden die
        hier groeien zijn ontstaan door eeuwenlange begrazing met schapen zonder
        bemesting; ze zijn zeldzaam en rijk aan bijzondere planten, waaronder orchideeën,
        en aan insecten.
      versterken:
        - "Laat open kalkgrasland open. Bebossing van een kalkhelling doet de grootste natuurwaarde hier verdwijnen."
        - "Beperk beplanting tot de randen en tot struweel: gele kornoelje, wollige sneeuwbal, zuurbes, wegedoorn, weichselboom en eenstijlige meidoorn."
        - "Kies bomen die op ondiepe, kalkrijke grond passen: meelbes, elsbes en veldesdoorn."
        - "Voer maaisel altijd af en bemest nooit; kalkgrasland is afhankelijk van verschraling en begrazing."
        - "Snoei struweel terug als het het grasland dreigt te overgroeien; open, warme, zonnige hellingen zijn hier het doel."
      bron: "BKNSN 2023 (code Lg3); natuurkennis.nl (OBN), H6210 Kalkgraslanden en Heuvellandschap"

    - id: zoetwatergetijdenafzetting
      match_exact: ["zoetwatergetijdenafzetting"]
      match: ["zoetwatergetijden", "zoetwatergetijde", "zoete getijde"]
      titel: "Zoetwatergetijdenafzetting"
      ontstaan: >-
        Hier werkte het getij, maar met zoet water. Zo ver landinwaarts bereikte het
        zeewater het gebied niet meer, terwijl de vloed het rivierwater wel twee keer
        per dag opstuwde. Daardoor stond het land regelmatig onder zoet water en bezonk
        er slib. Zo ontstonden zoetwatergetijdengebieden met kreken, gorzen en grienden;
        in de Biesbosch ging dat terug op de Sint-Elisabethsvloed van 1421. De dagelijkse
        waterstandswisseling maakte het landschap altijd vochtig en zeer voedselrijk.
        Door de Deltawerken is dat getijverschil teruggebracht tot enkele decimeters,
        waardoor deze gebieden sterk zijn veranderd.
      versterken:
        - "Kies soorten die permanente vochtigheid en periodieke overstroming aankunnen: schietwilg, katwilg, amandelwilg, zwarte els en gelderse roos."
        - "Griend is hier de meest kenmerkende vorm; wilgen worden bij snijgriend elk jaar en bij hakgriend elke drie tot vijf jaar afgezet."
        - "Zet knotwilgen langs kreken en kaden; die horen bij dit landschap."
        - "Houd kreken en geulen open; de getijdenwerking die er nog is, is waardevol."
        - "Overleg met de waterbeheerder voordat je in buitendijks gebied plant."
      bron: "BKNSN 2023 (code Zk6); RCE, Panorama Landschap - Biesbosch; natuurkennis.nl (OBN), N17.05 Wilgengriend"

    - id: zoutwatergetijdenafzetting
      match_exact: ["zoutwatergetijdenafzetting"]
      match: ["zoutwatergetijden", "zoutwatergetijde", "zoute getijde", "kwelder", "schor", "slik", "getijde"]
      titel: "Zoutwatergetijdenafzetting"
      ontstaan: >-
        Dit gebied is opgebouwd door de zee. Bij elke vloed stroomde zout water het
        gebied in en liet slib achter; laag na laag hoogde het land op. Zolang het nog
        vaak overstroomde bleef het kaal slik. Werd het hoger, dan vestigden zich
        zoutplanten en ontstond een kwelder of schor, doorsneden door kronkelende
        kreken. Veel van deze gebieden zijn later bedijkt en zijn nu polder, maar het
        oude patroon van kreken en hoogteverschillen is vaak nog zichtbaar. De bodem is
        kalkrijk en kan nog zout bevatten.
      versterken:
        - "Houd rekening met zout in de bodem, ook als het gebied allang bedijkt is."
        - "Kies robuuste soorten die zout en wind verdragen: duindoorn, vlier, eenstijlige meidoorn en schietwilg."
        - "Concentreer beplanting op het erf en langs de dijkvoet; buitendijks horen kwelder en slik open te blijven."
        - "Volg met beplanting het oude krekenpatroon of de kavelgrenzen in plaats van een rechte lijn dwars door het veld."
        - "Plant een gelaagde, dichte singel als windvang, met de laagste struiken aan de windzijde."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: overige_afzettingen
      match_exact: ["overige afzettingen"]
      match: ["overige afzetting"]
      titel: "Overige afzettingen"
      ontstaan: >-
        Deze plek ligt in het löss- en heuvellandschap van Zuid-Limburg, maar past niet
        in een van de vaste eenheden van de kaart, zoals plateau, helling, droogdal of
        terras. Het gaat om plaatselijke afzettingen die te klein of te afwijkend zijn om
        apart te benoemen. Het landschapsverhaal is hier dus niet met zekerheid te geven.
        De bodemsoort, de vochtklasse en de landvorm op deze plek zeggen meer dan dit
        kaartlabel.
      versterken:
        - "Kijk naar de bodemsoort en de vochtklasse van deze plek; die geven de beste aanwijzing voor de soortkeuze."
        - "Graaf een proefgat van ongeveer een halve meter diep om te zien wat er werkelijk in de ondergrond zit."
        - "Sluit met vorm en soortkeuze aan bij het landschap in de directe omgeving."
        - "Kies bij twijfel soorten met een brede tolerantie, zoals zomereik, eenstijlige meidoorn, hazelaar en vlier."
      bron: "BKNSN 2023 (code Lg8, löss- en heuvellandschap)"

    - id: terp
      match_exact: ["terp"]
      match: ["terp", "wierde", "woonheuvel", "huisterp"]
      titel: "Terp of wierde"
      ontstaan: >-
        Een terp of wierde is een kunstmatige woonheuvel. Voordat er dijken waren,
        overstroomde het kweldergebied bij elke stormvloed. Mensen wierpen daarom vanaf
        ongeveer 500 voor Christus heuvels op van mest, plaggen, huisafval en klei, en
        bouwden daar hun boerderijen en dorpen op. Ze hoogden die heuvels steeds verder
        op, tot ze omstreeks 1200 hun grootste hoogte bereikten; sommige komen meerdere
        meters boven het land uit. Na de bedijking waren ze niet meer nodig, maar veel
        dorpen liggen er nog steeds op. De grond van een terp is rijk, humeus en goed
        doorlatend, en zit vol archeologische resten.
      versterken:
        - "Graaf niet in de terp. De ophogingslagen zijn een archeologisch archief; terpen gelden als gebieden met een grote kans op archeologische vondsten en hebben een beschermde status."
        - "Plant ondiep wortelende beplanting en vermijd diepe grondbewerking op de terp zelf."
        - "Kies soorten die op rijke, goed doorlatende grond passen: gewone esdoorn, veldesdoorn, eenstijlige meidoorn, vlier en zoete kers."
        - "Versterk de rand van de terp met een struweelhaag of een bomenkrans; dat maakt de ronde vorm zichtbaar."
        - "Houd het zicht op de terp vanuit het open land vrij; de heuvel in de vlakte is hier het beeld."
      bron: "BKNSN 2023 (code At); RCE, Terp (cultuurhistorisch beheer)"

    - id: water
      match_exact: ["water"]
      match: ["water", "open water", "meer", "plas"]
      titel: "Open water"
      ontstaan: >-
        Op deze plek ligt water: een sloot, vaart, plas, meer, rivier of zeearm. Het
        Nederlandse waternet is voor een groot deel door mensen gemaakt of aangepast,
        met gegraven sloten, kanalen en ringvaarten, maar ook natuurlijke rivieren,
        kreken en veenplassen horen erbij. Voor beplanting is niet het water zelf van
        belang, maar de oever: daar bepalen de waterstand, de steilte van de kant en het
        beheer wat er kan groeien.
      versterken:
        - "Richt je op de oever en niet op het water; een flauw aflopende, kruidenrijke oever levert het meeste op."
        - "Kies natte soorten voor de waterkant: schietwilg, zwarte els, grauwe wilg en gelderse roos."
        - "Zet knotwilgen langs de kant; die zijn eeuwenoud gebruik en leveren nestholtes op."
        - "Maai de oever gefaseerd, zodat er altijd een deel blijft staan voor insecten en vogels."
        - "Overleg met het waterschap over de onderhoudsstrook voordat je langs een watergang plant."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

    - id: es
      match_exact: ["es"]
      match: ["esdek", "oud bouwland", "enkeerd", "essen en kampen", "es"]
      titel: "Es of oud bouwland"
      ontstaan: >-
        Dit is een oude akker die door mensen is opgehoogd. Vanaf de middeleeuwen tot het
        eind van de negentiende eeuw staken boeren plaggen en heidezoden, gebruikten die
        als strooisel in de stal en brachten het mengsel van mest en plaggen op hun
        akkers; vanaf ongeveer de achttiende eeuw gebeurde dat mengen in een speciale
        potstal. Zo groeide de akker langzaam omhoog en ontstond een donker plaggendek
        dat van dertig centimeter tot ruim een meter dik kan zijn. Essen liggen bijna
        altijd op de hogere, droge delen van het zandlandschap, vlak bij het dorp, en
        zijn vaak licht bol van vorm. De randen zijn nog te herkennen aan een steilrandje
        met oude eiken of een houtwal eromheen.
      versterken:
        - "Houd het open middenveld van de es open; de waarde zit juist in het bolle, onbebouwde akkervlak."
        - "Versterk de rand: een houtwal, een eikenrij of beplanting op het steilrandje maakt de vorm weer zichtbaar."
        - "Kies soorten van de zandgrond: zomereik, ruwe berk, hazelaar, lijsterbes en sleedoorn."
        - "Leg langs de esrand een bloemrijke akkerrand of kruidenzoom van enkele meters breed aan."
        - "Plant geen bos midden op de es; dat wist het historische patroon uit."
        - "Ploeg niet dieper dan gebruikelijk en graaf niet af; onder het opgebrachte dek zitten vaak archeologische resten."
      bron: "BKNSN 2023 (codes Dz4 en Sw5); RCE, Oude akkercomplexen (cultuurhistorisch beheer)"

    - id: antropogeen_element
      match_exact: ["antropogeen element"]
      match: ["antropogeen", "bebouwing", "opgehoogd", "vergraven", "opgespoten", "stedelijk"]
      titel: "Door mensen gemaakt element"
      ontstaan: >-
        Op deze plek is het natuurlijke systeem door mensen vervangen of onherkenbaar
        veranderd. Het gaat om bebouwing, wegen, bedrijventerreinen, opgehoogde of
        opgespoten terreinen en afgravingen. De oorspronkelijke bodem is er vaak
        vergraven, vermengd met puin of afgedekt met aangevoerd zand. De kaart zegt hier
        dus vooral iets over de menselijke ingreep en weinig over de natuurlijke
        ondergrond. Wat er kan groeien, hangt hier meer af van de ruimte onder de grond
        dan van het oorspronkelijke landschap.
      versterken:
        - "Graaf een proefgat en kijk wat je tegenkomt: op opgehoogd terrein wijkt de werkelijkheid vaak sterk af van de kaart."
        - "Zorg voor voldoende doorwortelbare ruimte; in bebouwd gebied is dat meestal de beperkende factor, niet de soortkeuze."
        - "Breek verdichte lagen open of kies een andere plantplaats voordat je een grote boom zet."
        - "Kies soorten die veel verdragen: veldesdoorn, eenstijlige meidoorn, vlier, zomereik en fladderiep."
        - "Sluit met vorm en soortkeuze aan bij het omringende landschap, ook al is de ondergrond hier kunstmatig."
        - "Combineer beplanting met ruimte voor water: op verhard terrein is elke plek waar regenwater kan wegzakken winst."
      bron: "BKNSN 2023 (Basiskaart Natuurlijk Systeem Nederland, WENR/CAS); Geologie van Nederland (TNO-GDN)"

