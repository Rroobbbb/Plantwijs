        holle wegen ontstonden waar karren zich in de zachte grond insneden.
      versterken:
        - "Plant altijd dwars op de helling. Een strook beplanting die het verhang volgt, versnelt erosie juist."
        - "Herstel graften: begroeide steilrandjes dwars op de helling die grond vasthouden."
        - "Kies soorten van de rijke lössgrond: haagbeuk, winterlinde, veldesdoorn, hazelaar, gele kornoelje en wollige sneeuwbal."
        - "Houd de bodem bedekt; kale löss is de grootste oorzaak van modderstromen in deze streek."
        - "Leg op het plateau een hoogstamboomgaard of een bomenrij langs de weg aan; dat past bij het open akkerbeeld."
