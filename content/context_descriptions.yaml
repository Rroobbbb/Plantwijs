      versterken:
        - "Houd het open middenveld van de es open. De waarde zit juist in het bolle, onbebouwde akkervlak."
        - "Versterk de rand: een houtwal, een eikenrij of een steilrandbeplanting langs de esrand maakt de vorm weer zichtbaar."
        - "Kies soorten van de zandgrond: zomereik, ruwe berk, hazelaar, lijsterbes en sleedoorn."
