        - "Plant niet strak tot aan de beek. Een onbeplante, kruidenrijke oeverstrook is waardevol en houdt de beek licht."
        - "Voer maaisel af en bemest niet; in een beekdal levert verschraling snel bloemrijk grasland op."
        - "Overleg met het waterschap over de onderhoudsstrook langs de beek voordat je plant."
