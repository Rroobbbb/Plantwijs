        - "Kies op de droge flanken zomereik, ruwe berk, sleedoorn en eenstijlige meidoorn."
        - "Houd de dalbodem begroeid; kale grond spoelt bij hevige regen snel uit."
        - "Herstel oude graften of steilrandjes als die er nog zijn; ze remmen erosie en horen bij het beeld."
