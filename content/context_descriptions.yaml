      ontstaan: >-
        Voor deze plek geeft de bodemkaart geen bruikbare waarde. Dat komt vaak voor in
        bebouwd gebied, bij open water of op grond die is opgehoogd of vergraven. In
        stedelijk gebied is de bodem meestal een mengsel van aangevoerd zand, puin en
        oude grond, en dan zegt de kaart weinig.
      versterken:
        - "Graaf een proefgat van ongeveer een halve meter diep en kijk wat je tegenkomt: zand, klei, veen, puin of verdichte lagen."
        - "Let op hoe snel water in het proefgat wegzakt; dat vertelt je meer over de standplaats dan de kaart."
        - "Kies bij twijfel soorten die veel verdragen, zoals eenstijlige meidoorn, vlier, veldesdoorn en zomereik."
        - "Verbeter bij bouwgrond eerst de structuur en de doorwortelbare ruimte voordat je grote bomen plant."
      bron: "BRO Bodemkaart (PDOK); geen kaartwaarde beschikbaar op deze plek"

  # ==========================================================================
  # VOCHT — vochtklasse afgeleid uit de grondwatertrap (Gt)
  # ==========================================================================
  vocht:
    - id: zeer_nat
      match_exact: ["zeer nat"]
      match: ["zeer nat"]
      titel: "Zeer nat"
      ontstaan: >-
        Deze klasse hoort bij grondwatertrap I en II. Het grondwater staat vrijwel het
        hele jaar dicht onder het maaiveld: in de natste tijd meestal binnen een halve
        meter en ook in de droogste tijd zelden dieper dan tachtig centimeter. Zulke
        plekken liggen in beekdalen, in veengebieden, in kommen en in oude geulen.
        Doordat de grond bijna altijd verzadigd is, komt er weinig zuurstof bij de
        wortels. Alleen soorten die daar speciaal op zijn ingesteld kunnen er goed
        groeien.
      versterken:
        - "Kies uitgesproken natte soorten: zwarte els, schietwilg, grauwe wilg, geoorde wilg, laurierwilg en gelderse roos."
        - "Plant op een licht opgeworpen rug of bult als je een soort wilt die iets minder nat wil staan."
        - "Kies vormen die bij nat land horen: elzensingel, knotbomen en griend werken hier goed."
        - "Ga niet draineren om meer soorten te kunnen planten. Juist de natte omstandigheden maken deze plek waardevol."
        - "Houd er rekening mee dat de wortelzone dun is; bomen worden hier minder hoog en minder stormvast."
      bron: "BRO Grondwatertrappen Gt (PDOK); klassegrenzen GHG/GLG uit BRO Model grondwaterspiegeldiepte (docs.geostandaarden.nl/bro/wdm)"

    - id: nat
      match_exact: ["nat"]
      match: ["nat"]
      titel: "Nat"
      ontstaan: >-
        Deze klasse hoort bij grondwatertrap III. In de natte tijd van het jaar komt het
        grondwater tot binnen ongeveer veertig centimeter onder maaiveld, dus tot in of
        vlak onder de wortelzone; in de droge tijd zakt het tot ergens tussen tachtig
        centimeter en 1,2 meter. De grond is daardoor een deel van het jaar verzadigd en
        een deel van het jaar goed doorlucht. Dat wisselende beeld hoort bij
        beekdalranden, lage kleigronden en de overgang van hoog naar laag. Voor
        beplanting betekent het dat de soort tegen een natte winter moet kunnen.
      versterken:
        - "Kies soorten die een natte winter verdragen: zwarte els, schietwilg, boswilg, vogelkers, gelderse roos en sporkehout."
        - "Plant niet te diep. In natte grond is te diep planten een veelvoorkomende oorzaak van uitval."
        - "Gebruik de hoogteverschillen: zet soorten die het droger willen een halve meter hoger op de flank."
        - "Elzensingels en knotbomen zijn hier de meest passende vormen."
        - "Wacht met planten tot de grond begaanbaar is; werken op natte grond verdicht hem blijvend."
      bron: "BRO Grondwatertrappen Gt (PDOK); klassegrenzen GHG/GLG uit BRO Model grondwaterspiegeldiepte (docs.geostandaarden.nl/bro/wdm)"

    - id: vochtig
      match_exact: ["vochtig"]
      match: ["vochtig"]
      titel: "Vochtig"
      ontstaan: >-
        Deze klasse hoort bij grondwatertrap IV en V. In de natte tijd van het jaar staat
        het grondwater ergens tussen een kwart meter en tachtig centimeter onder maaiveld,
        dus binnen bereik van diepere wortels; in de droge tijd zakt het tot voorbij
        tachtig centimeter en soms tot dieper dan 1,2 meter, ver genoeg om de grond goed
        doorlucht te houden. Dit is voor beplanting de meest gunstige situatie die in
        Nederland voorkomt: genoeg vocht in het groeiseizoen zonder dat de wortels
        verstikken. Verreweg de meeste bomen en struiken doen het hier goed.
      versterken:
        - "Je hebt hier de ruimste keuze. Laat de bodemsoort en het landschapstype de doorslag geven, niet het vocht."
        - "Bouw de beplanting gelaagd op: bomen, struiken en een kruidenzoom. Dat levert op deze standplaats het meeste op."
        - "Meng meerdere soorten door elkaar in plaats van rijen van één soort; dat maakt de beplanting minder gevoelig voor ziekten."
        - "Houd de bodem bedekt met blad en strooisel; dat houdt het vocht vast tot in de nazomer."
        - "Denk vooruit aan drogere zomers: neem ook een paar soorten op die droogte goed verdragen."
      bron: "BRO Grondwatertrappen Gt (PDOK); klassegrenzen GHG/GLG uit BRO Model grondwaterspiegeldiepte (docs.geostandaarden.nl/bro/wdm)"

    - id: droog
      match_exact: ["droog"]
      match: ["droog"]
      titel: "Droog"
      ontstaan: >-
        Deze klasse hoort bij grondwatertrap VI. Ook in de natte tijd van het jaar blijft
        het grondwater ongeveer een halve tot een hele meter onder maaiveld, en in de
        droge tijd zakt het dieper dan 1,2 meter weg: buiten bereik van de meeste
        wortels. Beplanting is daardoor vooral afhankelijk van het regenwater dat de
        bodem kan vasthouden. Zulke plekken liggen op dekzandruggen, stuwwallen,
        oeverwallen en hoge terrassen. In een droge zomer kan de bovengrond wekenlang
        uitdrogen, waardoor jonge beplanting het zwaar krijgt.
      versterken:
        - "Kies soorten die droogte goed doorstaan: zomereik, wintereik, ruwe berk, grove den, lijsterbes en sleedoorn."
        - "Plant in het najaar, zodat de wortels de hele winter en het voorjaar hebben om zich te vestigen."
        - "Gebruik kleiner plantmateriaal. Kleine planten slaan op droge grond veel betrouwbaarder aan dan grote."
        - "Leg een dikke laag houtsnippers of blad rond de planten; dat beperkt verdamping uit de bovengrond aanzienlijk."
        - "Geef de eerste twee zomers gericht water: liever een enkele keer veel dan vaak een beetje."
        - "Plant dicht genoeg om elkaar te beschutten; een gesloten beplanting droogt minder snel uit dan losse struiken."
      bron: "BRO Grondwatertrappen Gt (PDOK); klassegrenzen GHG/GLG uit BRO Model grondwaterspiegeldiepte (docs.geostandaarden.nl/bro/wdm)"

    - id: zeer_droog
      match_exact: ["zeer droog"]
      match: ["zeer droog"]
      titel: "Zeer droog"
      ontstaan: >-
        Deze klasse hoort bij grondwatertrap VII en VIII. Zelfs in de natste tijd van het
        jaar staat het grondwater dieper dan tachtig centimeter, bij trap VIII zelfs
        dieper dan anderhalve meter, en in de droge tijd zakt het nog verder weg. Voor
        vrijwel alle beplanting is het daarmee het hele jaar buiten bereik. De beplanting
        leeft van wat de bodem aan regenwater vasthoudt, en dat is op stuifzand, hoge
        duinen, stuwwaltoppen en grove zandgrond weinig. In de zomer droogt de bovengrond
        volledig uit. Alleen soorten die daarop zijn ingesteld houden het hier op eigen
        kracht vol.
      versterken:
        - "Kies uitgesproken droogtesoorten: grove den, ruwe berk, zomereik, jeneverbes, sleedoorn en duindoorn."
        - "Houd de beplanting laag en dicht. Struweel houdt op zeer droge grond veel beter stand dan losse bomen."
        - "Plant klein en plant in het najaar; grote planten redden het hier vaak niet."
        - "Bedek de grond rond de planten met strooisel of snippers en houd die laag de eerste jaren op peil."
        - "Verwacht uitval en plant er iets meer dan nodig; dat is op deze standplaats normaal."
        - "Bemest niet en breng geen aarde aan. Schrale droge grond is een landschapswaarde op zich."
      bron: "BRO Grondwatertrappen Gt (PDOK); klassegrenzen GHG/GLG uit BRO Model grondwaterspiegeldiepte (docs.geostandaarden.nl/bro/wdm)"

    - id: onbekend
      match_exact: []
      match: []
      titel: "Vochtklasse onbekend"
      ontstaan: >-
        Voor deze plek is geen grondwatertrap bekend. Dat komt vaak voor in bebouwd
        gebied, bij open water en op vergraven of opgehoogde grond, waar de oude
        grondwatergegevens niet meer kloppen. De vochtsituatie moet je hier dus ter
        plekke inschatten.
      versterken:
        - "Graaf een gat van ongeveer een halve meter diep en kijk of er water in loopt en hoe snel."
        - "Let op de begroeiing die er nu al staat: riet, pitrus en wilg wijzen op nat, struikhei en mos op droog."
        - "Kijk waar na een flinke regenbui plassen blijven staan; dat verraadt de lage en natte plekken."
        - "Kies bij twijfel soorten met een brede tolerantie, zoals zwarte els aan de natte kant en zomereik aan de drogere kant."
      bron: "BRO Grondwatertrappen Gt (PDOK); klassegrenzen GHG/GLG uit BRO Model grondwaterspiegeldiepte (docs.geostandaarden.nl/bro/wdm)"

  # ==========================================================================
  # GMM — landvormen uit de Geomorfologische kaart (BRO, WMS-omschrijving)
  # Volgorde is belangrijk: specifieke entries staan boven algemene.
  # ==========================================================================
  gmm:
    - id: esdek_oud_bouwland
      match_exact: []
      match: ["oud bouwland", "esdek", "enkeerd", "bouwlanddek", "essen en kampen", "eerdlaag"]
      titel: "Es of oud bouwland"
      ontstaan: >-
        Dit is een oude akker die door mensen is opgehoogd. Vanaf de middeleeuwen tot
        het eind van de negentiende eeuw staken boeren plaggen en heidezoden, gebruikten
        die als strooisel in de stal en brachten het mengsel van mest en plaggen op hun
        akkers. Vanaf ongeveer de achttiende eeuw gebeurde dat mengen in een speciale
        potstal. Zo groeide de akker langzaam omhoog en ontstond een donker plaggendek
        dat van dertig centimeter tot ruim een meter dik kan zijn. Zulke essen liggen
        bijna altijd op de hogere, droge delen van het zandlandschap, vlak bij het dorp.
        De randen zijn vaak nog te herkennen aan een steilrandje met oude eiken of een
        houtwal eromheen.
      versterken:
        - "Houd het open middenveld van de es open. De waarde zit juist in het bolle, onbebouwde akkervlak."
        - "Versterk de rand: een houtwal, een eikenrij of een steilrandbeplanting langs de esrand maakt de vorm weer zichtbaar."
        - "Kies soorten van de zandgrond: zomereik, ruwe berk, hazelaar, lijsterbes en sleedoorn."
        - "Leg langs de esrand een bloemrijke akkerrand of kruidenzoom aan van enkele meters breed."
        - "Plant geen bos midden op de es; dat wist het historische patroon uit."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); RCE, Oude akkercomplexen (cultuurhistorisch beheer)"

    - id: dekzandrug
      match_exact: []
      match: ["dekzandrug", "zandrug", "dekzandwelving", "welvingen in dekzand"]
      titel: "Dekzandrug"
      ontstaan: >-
        In de laatste ijstijd was de grond hier kaal en bevroren en had de wind vrij
        spel. Zand werd opgenomen en verderop weer neergelegd in langgerekte, lage
        ruggen: dekzandruggen. Aan het eind van de ijstijd kwam er meer begroeiing, die
        het zand vasthield, waardoor de ruggen bleven liggen. Ze kunnen kilometers lang
        en ongeveer honderd meter breed worden en zijn meestal maar één tot enkele meters
        hoog, maar in het vlakke zandlandschap is dat genoeg om droog te liggen. Juist
        daarom lagen de eerste akkers, boerderijen, kerken en wegen op deze ruggen. Het
        zand is arm en doorlatend, dus regenwater zakt snel weg.
      versterken:
        - "Leg een houtwal of houtsingel aan langs de rug; die volgt de vorm van het landschap en maakt hem zichtbaar."
        - "Kies droogteverdragende soorten: zomereik, wintereik, ruwe berk, lijsterbes, hazelaar en sleedoorn."
        - "Plant een solitaire eik of een kleine eikengroep op het hoogste punt; dat is hier een oud en herkenbaar beeld."
        - "Maak een brede kruidenrijke zoom aan de zuidzijde en maai die maar één keer per jaar."
        - "Vermijd bemesting en het aanvoeren van grond; de schraalheid is hier de landschapswaarde."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); Toelichting bij de legenda Geomorfologische kaart van Nederland 1:50.000 (WUR, 2017); Geologie van Nederland (TNO-GDN)"

    - id: dekzandvlakte
      match_exact: []
      match: ["dekzandvlakte", "dekzandlaagte", "vlakte van ten dele verspoelde dekzanden", "dekzandvlakten", "laagte in dekzand"]
      titel: "Dekzandvlakte of dekzandlaagte"
      ontstaan: >-
        Tussen de dekzandruggen liggen vlakke en lage delen. Ook daar is in de ijstijd
        zand neergelegd, maar zonder dat er duidelijke ruggen ontstonden. Omdat deze
        delen lager liggen, staat het grondwater er dichter onder het maaiveld. Van
        oudsher waren dit natte heidevelden, broekbossen en later, na ontwatering,
        weilanden en akkers. In de laagtes kan water in de winter lang blijven staan.
      versterken:
        - "Kies soorten die een natte winter aankunnen: zwarte els, zachte berk, boswilg, sporkehout en gelderse roos."
        - "Gebruik de kleine hoogteverschillen: plant droogteminnende soorten op de flanken en natte soorten in de laagte."
        - "Leg een singel of struweel aan langs de perceelrand; in het vlakke land geeft dat direct structuur."
        - "Ga niet extra draineren om te kunnen planten, maar kies soorten die bij het natte karakter passen."
        - "Laat laagtes waar water blijft staan met rust; die zijn waardevol voor amfibieën en insecten."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); Toelichting bij de legenda Geomorfologische kaart van Nederland 1:50.000 (WUR, 2017); Geologie van Nederland (TNO-GDN)"

    - id: stuifzand_landduinen
      match_exact: []
      match: ["stuifzand", "landduin", "hoge duinen", "lage duinen met bijbehorende", "stuifzandvlakte", "verstoven"]
      titel: "Stuifzand en landduinen"
      ontstaan: >-
        Deze duinen liggen ver van zee en zijn door mensen op gang geholpen. Toen de
        heide vanaf de middeleeuwen zwaar werd begraasd en er plaggen werden gestoken,
        raakte de bodem plaatselijk kaal. Op het onbeschermde zand kreeg de wind opnieuw
        grip en ging het stuiven. Zo ontstonden landduinen, zandverstuivingen en de
        uitgestoven vlaktes ertussen. In de negentiende en twintigste eeuw is het
        meeste stuifzand vastgelegd met grove den. Wat overbleef is een extreem droge,
        arme bodem met vaak nog maar een dun laagje humus.
      versterken:
        - "Kies alleen soorten die extreme droogte en armoede aankunnen: grove den, ruwe berk, zomereik, jeneverbes en struikhei."
        - "Houd beplanting laag en dicht bij het erf; open stuifzand en schrale vegetatie zijn hier zelf de natuurwaarde."
        - "Plant klein plantmateriaal in het najaar en reken op enige uitval."
        - "Voeg geen grond, compost of mest toe. Verrijking is hier de grootste bedreiging voor de bijzondere soorten."
        - "Laat open zandplekken open; ze zijn belangrijk voor warmteminnende insecten en reptielen."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); Toelichting bij de legenda Geomorfologische kaart van Nederland 1:50.000 (WUR, 2017); Geologie van Nederland (TNO-GDN)"

    - id: stuwwal
      match_exact: []
      match: ["stuwwal", "gestuwde", "stuwwalglooiing"]
      titel: "Stuwwal"
      ontstaan: >-
        Tijdens de voorlaatste ijstijd, het Saalien, schoof ongeveer 150.000 jaar geleden
        landijs vanuit het noorden Nederland binnen. Het ijs kwam tot ongeveer de lijn
        Haarlem-Utrecht-Nijmegen. De ijstongen duwden de bodem voor zich uit en omhoog,
        zoals een schaaf een krul opschuift. De opgestuwde lagen zand, grind en klei
        vormen de heuvels die we nu stuwwallen noemen, zoals de Veluwe en de Utrechtse
        Heuvelrug; de hoogste komen tot ruim honderd meter boven zeeniveau. Doordat ze
        hoog liggen, zakt regenwater diep weg en is de bovengrond droog en arm. In de
        schuin opgestuwde lagen zit soms leem, waardoor water plaatselijk juist blijft
        hangen.
      versterken:
        - "Kies soorten die droogte en armoede verdragen: zomereik, wintereik, ruwe berk, grove den, lijsterbes en hazelaar."
        - "Plant op de hellingen dwars op het verhang; dat houdt regenwater en bodem beter vast."
        - "Maak de overgang van bos naar open terrein geleidelijk met een mantel van struiken en een kruidenzoom."
        - "Let op leemlagen in de ondergrond; waar water blijft staan passen zachte berk en sporkehout beter."
        - "Laat oude, dikke bomen en dood hout staan; op de stuwwal zijn dat de rijkste plekken voor paddenstoelen, insecten en vogels."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); Toelichting bij de legenda Geomorfologische kaart van Nederland 1:50.000 (WUR, 2017); Geologie van Nederland (TNO-GDN)"

    - id: smeltwaterwaaier
      match_exact: []
      match: ["smeltwater", "sandr", "spoelzandwaaier", "daluitspoeling", "puinwaaier"]
      titel: "Smeltwaterwaaier"
      ontstaan: >-
        Aan de voet van de stuwwallen kwam bij het afsmelten van het landijs enorm veel
        water vrij. Dat smeltwater voerde zand en grind mee en spreidde het uit in
        brede, flauw hellende waaiers. Hoe verder van de stuwwal, hoe fijner het
        materiaal dat bleef liggen. Het resultaat is een licht hellend vlak van grof,
        goed doorlatend zand. Water zakt er snel weg, dus de bovengrond is droog.
      versterken:
        - "Kies droogteverdragende soorten: zomereik, ruwe berk, grove den, lijsterbes en sleedoorn."
        - "Plant in de laagste delen van de waaier ook soorten die meer vocht willen, zoals zwarte els en sporkehout."
        - "Leg lange singels of houtwallen aan in de richting van het verhang, zodat het flauwe reliëf zichtbaar blijft."
        - "Houd de bodem bedekt met strooisel; op grof zand verdwijnt vocht anders erg snel."
        - "Bemest niet; deze grond is van nature schraal en dat hoort erbij."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); Toelichting bij de legenda Geomorfologische kaart van Nederland 1:50.000 (WUR, 2017); Geologie van Nederland (TNO-GDN)"

    - id: droogdal
      match_exact: []
      match: ["droogdal", "dalvormige laagte", "droge dalen"]
      titel: "Droogdal"
      ontstaan: >-
        Een droogdal is een dal zonder beek. Het is ontstaan in de ijstijden, toen de
        ondergrond permanent bevroren was. Smeltwater kon toen niet wegzakken en
        stroomde over het oppervlak, waarbij het dalen uitsleet. Toen de bodem later
        ontdooide, zakte het water gewoon de grond in en viel de beek droog. Wat
        overbleef is een duidelijk dal waar alleen bij zware buien nog water doorheen
        stroomt. In de dalbodem is de grond vaak wat fijner en vochthoudender dan op de
        flanken.
      versterken:
        - "Plant dwars op het dal, niet in de lengterichting. Zo vangt de beplanting afstromend water en grond op."
        - "Kies in de dalbodem soorten die meer vocht willen: haagbeuk, hazelaar, gele kornoelje en zwarte els."
        - "Kies op de droge flanken zomereik, ruwe berk, sleedoorn en eenstijlige meidoorn."
        - "Houd de dalbodem begroeid; kale grond spoelt bij hevige regen snel uit."
        - "Herstel oude graften of steilrandjes als die er nog zijn; ze remmen erosie en horen bij het beeld."
      bron: "BRO Geomorfologische kaart (GMM, PDOK); Toelichting bij de legenda Geomorfologische kaart van Nederland 1:50.000 (WUR, 2017); Geologie van Nederland (TNO-GDN)"

    - id: loss_glooiing_plateau
      match_exact: []
      match: ["löss", "loss", "lössglooiing", "lossglooiing", "plateau", "glooiing van", "krijtplateau"]
      titel: "Lössglooiing of plateau"
      ontstaan: >-
        Tijdens de ijstijden waaide fijn stof over het kale land en bleef liggen als een
        dikke laag löss. In Zuid-Limburg ligt die löss op oude rivierterrassen en op
        kalksteen. De hoge, vlakke delen heten plateaus; daartussen liggen glooiende
        hellingen die naar de dalen aflopen. Löss is vruchtbaar en goed bewerkbaar,
        maar zeer gevoelig voor erosie: bij een felle bui slaat de grond dicht en
        stroomt hij als modder de helling af. Op de hellingen liggen graften,
