      - lichte_structuren
      - soortkeuze_robust
  nsn_modifiers:
    uitleg: NSN/BKNSN-modifiers verschuiven de basisuitkomst. Gebruik deze alleen
      als de NSN-eenheid duidelijk een nat/droog/stagnatie/dynamiek-signaal geeft
      dat niet al in Gt tot uitdrukking komt.
    regels:
    - nsn:
      - bknsn_rg2
      - bknsn_rg3
      - bknsn_rg5
      - bknsn_zk4
      - bknsn_zk6
      - bknsn_zk7
      - bknsn_lv2
      - bknsn_hv3
      effect:
        verschuif_klasse: -1
      toelichting: 'Kom/uiterwaard/restgeul/kreekbedding/petgaten: meer natstress
        en lagere effectieve beworteling.'
    - nsn:
      - bknsn_dz3
      - bknsn_rt3
      - bknsn_bd3
      - bknsn_sw2
      - bknsn_sw3
      effect:
        verschuif_klasse: 1
      toelichting: 'Stuifzand/rivierduin/duinen/sandr: vaak diep doorwortelbaar maar
        droogterisico; effectieve wortelzone kan dieper.'
    - nsn:
      - bknsn_kl2
      - bknsn_sw4x
      - keileemgebied
      effect:
        verschuif_klasse: -1
      toelichting: Keileem/stagnatie verlaagt effectieve beworteling door zuurstofgebrek
        en storende lagen.
    - nsn:
      - bknsn_dz4
      - bknsn_sw5
      - dekzand_dekzandrug
      effect:
        min_cm_plus: 10
        max_cm_plus: 20
      toelichting: 'Essen/akkerruggen: humusrijke bovengrond vergroot effectieve wortelruimte
        in de bovenlaag.'
    klasse_orde:
    - zeer_beperkt
    - beperkt
    - matig
    - goed
    - zeer_goed
  toepassing:
    stappen:
    - 1) Bepaal bodemcomponent (textuur/bodemtype) en Gt-klasse voor locatie.
    - 2) Kies bijpassende basisregel (bodem × Gt) → klasse + bandbreedte.
    - 3) Pas NSN/BKNSN-modifier toe indien relevant (verschuif klasse of cm-banden).
    - 4) Voeg waarschuwingen toe bij verdichte/storende lagen of afwijkend peilbeheer.
    outputvelden:
    - klasse
    - wortelbare_diepte_cm
    - beperkende_factoren
    - maatregelen
  bronnen:
  - stowa_2010_grondwaterregime_op_basis_van_karteerba
  - wur_water_en_bomen_achtergrond_beworteling
  - wur_bodemfysica_en_beworteling_achtergrond
  - wur_stichting_voor_bodemkartering_bodemkaart_van_n
  - wur_landschapsleutel_legenda_s_bodemkaarten_gt_sys
