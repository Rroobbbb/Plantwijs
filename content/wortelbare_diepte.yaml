      - wateropvang_infiltratie
      - droogtetolerante_soorten
    - bodem:
      - zavel
      - leem
      - lichte_klei
      gt:
      - vao
      - vad
      - vbo
      - vbd
      klasse: goed
      wortelbare_diepte_cm: 100-150
      beperkende_factoren:
