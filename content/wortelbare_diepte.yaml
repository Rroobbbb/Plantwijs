wortelbare_diepte:
  meta:
    naam: Beplantingswijzer – Wortelbare diepte (bandbreedtes)
    versie: '2025-12-16'
    doel: Machineleesbare regels om op basis van NSN/BKNSN, bodem en Gt een indicatieve
      wortelbare diepte (cm) te duiden voor erfbeplanting.
    opmerking: Wortelbare diepte is indicatief. Lokale factoren (verdichting, storende
      lagen, drainage/peilbeheer, microreliëf/AHN, tijdelijke extremen) kunnen sterk
      afwijken van kaartwaarden.
    output:
      eenheid: cm
      vorm: bandbreedte (min-max)
      interpretatie: De bandbreedte is de meest waarschijnlijke effectieve bewortelbare
        zone voor bomen/struiken zonder ingrijpende grondverbetering.
  klassen:
    zeer_beperkt:
      band_cm: 0-30
      indicatie: Wortelzone zeer beperkt; natstress of storende lagen domineren.
    beperkt:
      band_cm: 30-60
      indicatie: Wortelzone beperkt; keuze soorten en maatregelen belangrijk.
    matig:
      band_cm: 60-100
      indicatie: Redelijk; veel soorten mogelijk met standplaatsgericht beheer.
    goed:
      band_cm: 100-150
      indicatie: Goede wortelruimte; brede soortenkeuze, mits bodemstructuur goed.
    zeer_goed:
      band_cm: 150-200
      indicatie: Zeer goede wortelruimte; droogterisico hangt vooral van vochtbuffer
        af.
  basisregels_bodem_gt:
    uitleg: Basisregels bepalen de wortelbare diepte primair uit Gt (nat–droog) en
      bodemtextuur/organisch materiaal. Daarna kunnen NSN/BKNSN-modifiers de uitkomst
      verschuiven (natter/droger/kwel/stagnatie/dynamiek).
    regels:
    - bodem:
      - zware_klei
      - klei
      - veen
      - moerige_grond
      gt:
      - ia
      - ib
      klasse: zeer_beperkt
      wortelbare_diepte_cm: 0-30
      beperkende_factoren:
      - zuurstofgebrek
      - lage_draagkracht
      - wortelverstikking
      maatregelen:
      - microverhoging
      - beperk_belasting
      - kies_nattolerant
    - bodem:
      - zand
      - lemig_zand
      - zavel
      - lichte_klei
      gt:
      - ia
      - ib
      klasse: beperkt
      wortelbare_diepte_cm: 30-60
      beperkende_factoren:
      - zuurstofgebrek_in_laagtes
      - instabiele_verankering
      maatregelen:
      - plant_op_ruggen
      - structuurverbetering
      - kies_nattolerant
    - bodem:
      - zware_klei
      - klei
      - veen
      - moerige_grond
      gt:
      - iia
      - iib
      klasse: beperkt
      wortelbare_diepte_cm: 30-60
      beperkende_factoren:
      - periodieke_natte_wortelzone
      - structuurgevoeligheid
      maatregelen:
      - microreliëf_benutten
      - werk_bij_draagkracht
      - kies_robuust
    - bodem:
      - zand
      - lemig_zand
      - zavel
      - lichte_klei
      - leem
      gt:
      - iia
      - iib
      klasse: matig
      wortelbare_diepte_cm: 60-100
      beperkende_factoren:
      - natte_perioden_winter
      - zomerdroogte_op_zand_mogelijk
      maatregelen:
      - mulch_organische_stof
      - standplaatszonering
      - kies_mix_soorten
    - bodem:
